name: ci
on: [push, pull_request, workflow_dispatch]

# One run per branch: a newer push (or a duplicate delivery of the same one) replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 40   # a normal run is about 8 minutes, with the checks before the tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: wasifyai, POSTGRES_PASSWORD: wasifyai, POSTGRES_DB: wasifyai }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wasifyai" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://wasifyai:wasifyai@localhost:5432/wasifyai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      # The voice product converts recordings with ffmpeg (macOS uses afconvert); the runner has neither.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright
      - name: Migrate (also proves 0001-0003 apply on an empty database)
        run: cd services/api && uv run alembic upgrade head
      # Integration tests for Postgres/pgvector and the Redis media pipeline (with a stub worker)
      # run here; the storage, LiteLLM and ComfyUI ones skip themselves.
      # a normal run takes about 4 minutes. conftest.py has a watchdog: a test that hangs ends the run by itself and
      # the next step prints which test and where it was stuck (a cancelled job loses its log)
      # The step has a time limit of its own: a step that is stopped keeps its log (a whole job that is cancelled
      # does not), and `-v` has printed the name of the test that was running. `faulthandler_timeout` prints where
      # every thread is stuck when one test runs over 5 minutes.
      # Every run since the Video Builder commit (f7e3da8) has hung here with no log: the runner stops answering and
      # neither a step nor a job limit fires. scripts/ci/guard.sh watches the memory, writes a snapshot every 30 s and, when
      # it runs low, stops the tests (with every thread's stack) so the log survives; both files are uploaded below.
      # The tests run in steps of their own, each with a time limit: the runner has stopped answering in the middle of the
      # tests on every run since 21 October, and the first step of four (packages and products) is where it went on 22
      # October. Nothing reproduces it (the same command passes in 3 minutes in a Linux container with 7 GB and 2 CPUs and
      # the same Postgres and Redis). A step that has finished keeps its log, so the step that never ends names the group.
      - name: Tests, the platform SDK
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 packages 2>&1 | tee "$RUNNER_TEMP/pytest-1.log"
      - name: Tests, the assistant
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 products/wasifyai-assistant 2>&1 | tee "$RUNNER_TEMP/pytest-2.log"
      - name: Tests, images
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 products/wasifyai-image 2>&1 | tee "$RUNNER_TEMP/pytest-3.log"
      - name: Tests, 3D
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 products/wasifyai-model3d 2>&1 | tee "$RUNNER_TEMP/pytest-4.log"
      - name: Tests, notebooks
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 products/wasifyai-notebooks 2>&1 | tee "$RUNNER_TEMP/pytest-5.log"
      - name: Tests, video
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 products/wasifyai-video 2>&1 | tee "$RUNNER_TEMP/pytest-6.log"
      - name: Tests, voice
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 products/wasifyai-voice 2>&1 | tee "$RUNNER_TEMP/pytest-7.log"
      - name: Tests, the API
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 services/api/tests --ignore=services/api/tests/integration 2>&1 | tee "$RUNNER_TEMP/pytest-8.log"
      - name: Tests, the API, with Postgres and Redis
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 services/api/tests/integration 2>&1 | tee "$RUNNER_TEMP/pytest-9.log"
      - name: Tests, the workers
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        shell: bash
        env:
          GUARD_LOG: ${{ runner.temp }}/resources.txt
        run: scripts/ci/guard.sh uv run pytest -v -o faulthandler_timeout=240 services/media-worker services/engine-worker 2>&1 | tee "$RUNNER_TEMP/pytest-10.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-log
          path: |
            ${{ runner.temp }}/pytest-*.log
            ${{ runner.temp }}/resources.txt
            ${{ runner.temp }}/test-watchdog.txt
          if-no-files-found: ignore
      - if: failure() || cancelled()
        name: Where a hung test stopped
        shell: bash
        run: |
          cat "$RUNNER_TEMP/test-watchdog.txt" 2>/dev/null || echo "the watchdog did not stop anything"
          echo "=== the machine, last snapshots"
          tail -40 "$RUNNER_TEMP/resources.txt" 2>/dev/null || echo "no snapshots"
          echo "=== processes still running"
          ps -eo pid,ppid,stat,etime,args --forest | head -60
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm design:check   # the generated tokens match design/DESIGN.md, and no screen hard-codes a colour or size (ADR-0081)
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm chat:bundle-check   # the new chat's first screen is within its gzip budget and holds no call to assistant-cloud or safe-content-frame's host (ADR-0082)
      - run: pnpm --filter web build   # catches what lint and types cannot: a broken production build
      # the screens shared with the desktop window, in a real browser: layout checks only (the screenshots are
      # kept per operating system, see apps/web/playwright.config.ts)
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e:layout
  setup:
    # Proves `make setup` installs tools on a clean machine. Ollama is stubbed: its installer is
    # the vendor's own and several GB, and the engine/model steps need a full machine.
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo install -m 755 /dev/stdin /usr/local/bin/ollama <<< $'#!/bin/sh\nexit 0'
          SETUP_TOOLS_ONLY=1 ./scripts/setup.sh -y --k8s
      - run: |
          export PATH="$HOME/.local/bin:$PATH"
          for t in uv pnpm node kind helm kubectl podman make; do command -v $t; done
          node -v && uv --version && kind version && helm version --short
  helm-kind:
    runs-on: ubuntu-latest
    env:
      CONTAINER_ENGINE: docker
      # No Ollama in CI: the smoke test accepts a clean `error` event, which still proves
      # web -> BFF -> API -> LiteLLM wiring, migrations and readiness.
      OLLAMA_EXTERNAL_URL: http://127.0.0.1:11434
      KIND_MODE: light   # a hosted runner is too small for the models; `full` is for a workstation
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: make helm-lint
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - run: ./scripts/kind-up.sh
      - run: ./scripts/kind-smoke.sh
      - if: failure()
        run: |
          kubectl -n wasifyai get pods -o wide
          kubectl -n wasifyai describe pods | tail -80
          for d in api litellm web; do echo "--- $d"; kubectl -n wasifyai logs deploy/wasifyai-$d --tail=40 || true; done
          # the migration job is the pod that fails first: say why, from this try and the one before it
          echo "--- migrate"; kubectl -n wasifyai logs job/wasifyai-migrate --tail=80 || true
          kubectl -n wasifyai logs job/wasifyai-migrate --previous --tail=80 || true
          kubectl -n wasifyai describe job wasifyai-migrate | tail -30 || true
  images:
    # Switched off for ordinary pushes while the app is built (the multi-arch build is the slowest job by
    # far). It runs for a release tag (`git tag v0.1.0 && git push origin v0.1.0`) or by hand (Actions >
    # ci > Run workflow, on main). To build on every push to main again, use
    # `github.ref == 'refs/heads/main' || ...` here.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [python, web, helm-kind]
    runs-on: ubuntu-latest
    # Eight images, two architectures, the arm64 half under QEMU: this is the slowest job by far. The
    # limit keeps a stuck build from holding the run open for GitHub's six hours.
    timeout-minutes: 120
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          sudo apt-get update && sudo apt-get install -y buildah
          for s in services/api services/media-worker products/wasifyai-notebooks apps/web; do
            n=$(basename $s)
            buildah build --platform linux/arm64,linux/amd64 --manifest ghcr.io/${{ github.repository }}/$n:${{ github.sha }} -f $s/Containerfile .
            buildah manifest push --all ghcr.io/${{ github.repository }}/$n:${{ github.sha }} docker://ghcr.io/${{ github.repository }}/$n:${{ github.sha }}
            buildah manifest push --all ghcr.io/${{ github.repository }}/$n:${{ github.sha }} docker://ghcr.io/${{ github.repository }}/$n:latest
          done
          # The model servers are for the NVIDIA hosts (staging, GCP), so amd64 only: the arm64 build under QEMU
          # would take hours and nothing runs it.
          for s in services/comfyui; do
            n=$(basename $s)
            buildah build --platform linux/amd64 --manifest ghcr.io/${{ github.repository }}/$n:${{ github.sha }} -f $s/Containerfile .
            buildah manifest push --all ghcr.io/${{ github.repository }}/$n:${{ github.sha }} docker://ghcr.io/${{ github.repository }}/$n:${{ github.sha }}
            buildah manifest push --all ghcr.io/${{ github.repository }}/$n:${{ github.sha }} docker://ghcr.io/${{ github.repository }}/$n:latest
          done
