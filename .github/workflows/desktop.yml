name: desktop
# ADR-0056: macOS, Windows and Linux from day one. The engine tests run the desktop profile (SQLite, the
# in-process queue, local files); the shell job type-checks and builds the window and builds the Tauri shell.
# No signing and no installer in Phase 1.
on:
  workflow_dispatch:
  push:
    paths:
      - apps/desktop/**
      - apps/web/**
      - services/api/**
      - services/media-worker/**
      - packages/**
      - products/wasifyai-image/**
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - apps/web/**
      - services/api/**
      - services/media-worker/**
      - packages/**
      - products/wasifyai-image/**
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml

# One run per branch: a newer push (or a duplicate delivery of the same one) replaces the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The runners carry several Pythons (macOS: a 3.15 pre-release some wheels do not exist for); the engine
# is 3.12, like the installer's pin. Only uv's own builds are used: the macOS runner's 3.12 cannot load
# SQLite extensions (the notebooks' vector index needs them), and the packaged app runs on uv's build too.
env:
  UV_PYTHON: "3.12"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  workflows:
    # A workflow file GitHub cannot parse fails with no jobs and no log; this catches it before a push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # syntax, contexts and expressions of every workflow
      - run: uvx --from actionlint-py actionlint -shellcheck=
      # and shellcheck on the scripts of the desktop workflow too (ci.yml predates this check)
      - run: uvx --from actionlint-py actionlint .github/workflows/desktop.yml

  engine:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Engine tests under the desktop profile
        run: >
          uv run pytest -v
          packages/platform-sdk/tests/test_sqlite_adapters.py
          packages/platform-sdk/tests/test_storage.py
          services/api/tests/test_sqlite_stores.py
          services/api/tests/test_desktop_profile.py
          services/api/tests/test_local_embedder.py
          products/wasifyai-image/tests/test_image_sqlite.py

  shell:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: apps/desktop/src-tauri }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
        working-directory: .
      - name: Build the window
        run: pnpm --filter @wasifyai/desktop build
        working-directory: .
      - name: Window and shared package tests
        run: pnpm --filter @wasifyai/desktop --filter @wasifyai/ui --filter @wasifyai/client test
        working-directory: .
      - if: runner.os == 'Linux'
        name: System libraries for the webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: cargo test --locked
      - run: cargo build --release --locked

  smoke:
    # The whole window, as a person would use it: make an image, exit 0 or 1 (apps/desktop/src/smoke.ts).
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @wasifyai/desktop build
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - if: runner.os != 'Linux'
        name: Self-test
        working-directory: apps/desktop/src-tauri
        env: { WASIFYAI_SMOKE: "1" }
        run: cargo run --locked
      - if: runner.os == 'Linux'
        name: Self-test (virtual display)
        working-directory: apps/desktop/src-tauri
        env:
          WASIFYAI_SMOKE: "1"
          # no GPU on a hosted runner: WebKitGTK must not try to use one
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a cargo run --locked

  install:
    # A clean install, as a first run does it: build the engine bundle, let the app download uv and Python
    # and install the packages into an empty folder, then make an image in the window.
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @wasifyai/desktop build
      - name: Engine bundle
        shell: bash
        run: ./scripts/build-engine-bundle.sh
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Install and self-test
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          WASIFYAI_SMOKE: "1"
          WASIFYAI_PROVISION: "1"
          WASIFYAI_DATA_DIR: ${{ runner.temp }}/wasifyai-data
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a cargo run --locked; else cargo run --locked; fi
      - if: always()
        name: Installer log
        shell: bash
        run: cat "${{ runner.temp }}/wasifyai-data/logs/provision.log" || true

  package:
    # The packaged app: the engine bundle inside the app's resources, a first run on a machine with no
    # checkout (WASIFYAI_REPO points nowhere), the self-test, and the numbers it prints (SMOKE_METRICS:
    # time to ready with the install included, engine and shell memory). Unsigned: no signing in Phase 1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bundles: app }
          - { os: ubuntu-latest, bundles: deb }
          - { os: windows-latest, bundles: nsis }
    runs-on: ${{ matrix.os }}
    env:
      WASIFYAI_SMOKE: "1"
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
      # a hosted Linux runner has no accessibility bus; GTK would otherwise wait for one (Linux only)
      NO_AT_BRIDGE: "1"
    steps:
      - uses: actions/checkout@v4
      # (the `runner` context is not available in a job's `env`, so these are set here)
      - name: Paths for the run
        shell: bash
        run: |
          {
            echo "WASIFYAI_REPO=$RUNNER_TEMP/no-checkout"
            echo "WASIFYAI_DATA_DIR=$RUNNER_TEMP/wasifyai-data"
            echo "WASIFYAI_SMOKE_OUT=$RUNNER_TEMP/smoke.txt"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Engine bundle
        shell: bash
        run: ./scripts/build-engine-bundle.sh
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec tauri build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - name: What was built
        shell: bash
        run: find apps/desktop/src-tauri/target/release/bundle -maxdepth 3 \( -name '*.app' -o -name '*.deb' -o -name '*.exe' \) -exec du -sh {} +

      - if: runner.os == 'macOS'
        name: Run the packaged app (first run installs the engine)
        shell: bash
        run: |
          apps=(apps/desktop/src-tauri/target/release/bundle/macos/*.app)
          app="${apps[0]}"
          "$app/Contents/MacOS/wasifyai-desktop"
          echo "--- second run, already installed"
          "$app/Contents/MacOS/wasifyai-desktop"
      - if: runner.os == 'Linux'
        name: Run the packaged app (first run installs the engine)
        shell: bash
        run: |
          debs=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/deb-root"
          exe="$RUNNER_TEMP/deb-root/usr/bin/wasifyai-desktop"
          xvfb-run -a "$exe"
          echo "--- second run, already installed"
          xvfb-run -a "$exe"
      - if: runner.os == 'Linux'
        # Experiment: is the 30 s before the shell's setup hook the single-instance plugin waiting for a
        # D-Bus session bus that a bare runner lacks? Same app, same data, under a session bus. It cannot
        # fail the job; the numbers are in the self-test lines.
        name: Relaunch under a session bus (experiment)
        continue-on-error: true
        shell: bash
        run: |
          debs=(apps/desktop/src-tauri/target/release/bundle/deb/*.deb)
          exe="$RUNNER_TEMP/deb-root/usr/bin/wasifyai-desktop"
          if command -v dbus-run-session >/dev/null; then
            xvfb-run -a dbus-run-session -- "$exe"
          else
            echo "dbus-run-session is not installed on this runner: no result"
          fi
          echo "(package: ${debs[0]})"
      - if: runner.os == 'Windows'
        name: Install and run the packaged app (first run installs the engine)
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "wasifyai-app"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dir" -Wait
          $exe = Join-Path $dir "wasifyai-desktop.exe"
          # a release build is a Windows-subsystem program: start it and wait, then read its verdict file
          foreach ($run in "first", "second (already installed)") {
            $p = Start-Process -FilePath $exe -Wait -PassThru
            Write-Host "$run run exited with $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$run run failed" }
          }
      - if: always()
        name: Verdicts and installer log
        shell: bash
        run: |
          echo "--- self-test lines"; cat "$WASIFYAI_SMOKE_OUT" || true
          echo "--- installer log"; cat "$WASIFYAI_DATA_DIR/logs/provision.log" || true

  llamacpp:
    # The optional language engine, as a person gets it: press "Set up the language engine" (the window's
    # self-test does), then start the installed llama-server on a tiny model and ask it for a chat answer.
    # The model is 1.2 MB, pinned by commit and checked by SHA-256. macOS here: that is where the engine
    # uses a GPU; the other platforms are covered by the unit tests of the installer.
    runs-on: macos-latest
    env:
      WASIFYAI_SMOKE: "1"
      WASIFYAI_SMOKE_COMPONENT: llamacpp
    steps:
      - uses: actions/checkout@v4
      - name: Paths for the run
        shell: bash
        run: |
          {
            echo "WASIFYAI_DATA_DIR=$RUNNER_TEMP/wasifyai-data"
            echo "WASIFYAI_LLAMA_DATA_DIR=$RUNNER_TEMP/wasifyai-data"
            echo "WASIFYAI_SMOKE_OUT=$RUNNER_TEMP/smoke.txt"
            echo "WASIFYAI_LLAMA_MODEL=$RUNNER_TEMP/stories260K.gguf"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @wasifyai/desktop build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Engine environment
        run: uv sync --all-packages
      - name: Set up the language engine in the window
        working-directory: apps/desktop/src-tauri
        run: cargo run --locked
      - name: A tiny model
        run: |
          curl -sSL --fail -o "$WASIFYAI_LLAMA_MODEL" \
            "https://huggingface.co/ggml-org/models/resolve/499bc8821c6b12b4e53c5bffcb21ec206f212d81/tinyllamas/stories260K.gguf"
          echo "270cba1bd5109f42d03350f60406024560464db173c0e387d91f0426d3bd256d  $WASIFYAI_LLAMA_MODEL" | shasum -a 256 -c -
      - name: Start the installed server on it and ask for an answer
        run: uv run pytest -s services/api/tests/integration/test_llama_installed.py
      - if: always()
        name: Verdict and installer log
        run: |
          echo "--- self-test"; cat "$WASIFYAI_SMOKE_OUT" || true
          echo "--- installer log"; tail -n 40 "$WASIFYAI_DATA_DIR/logs/provision.log" || true

  video-builder:
    # The Video Builder component as a person gets it (ADR-0077, V1a): the pinned downloads with every hash
    # checked (FFmpeg and ffprobe come with it: the runner has none), then hostile compositions rendered through the real adapter with the real pinned browser (V1b).
    # Each page attacks while HyperFrames renders it; a service on loopback must hear nothing and the filter
    # must refuse what the page asks for. Apple-silicon macOS only: that is where the component is supported.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Install the component
        run: |
          home="$(uv run python scripts/ci-video-builder.py "$RUNNER_TEMP/video-builder-data" | tail -1)"
          echo "WASIFYAI_VIDEO_BUILDER_HOME=$home" >> "$GITHUB_ENV"
      - name: Hostile compositions, the filter and the guard
        run: uv run pytest -s services/api/tests/test_video_builder_hostile.py services/api/tests/test_video_builder_sandbox.py services/api/tests/test_video_builder_runtime.py
      - name: The five templates, the exact-text check and the alpha files (MG1)
        run: uv run pytest -s services/api/tests/test_video_builder_templates.py

  comfyui:
    # The optional image engine, as a person gets it: press "Set up image generation" (the window's
    # self-test does), then start the installed ComfyUI and ask it what device it found. No model is
    # downloaded. Apple-silicon macOS only: that is where the component is supported (stage A of phase 2).
    runs-on: macos-latest
    env:
      WASIFYAI_SMOKE: "1"
      WASIFYAI_SMOKE_COMPONENT: comfyui
      WASIFYAI_PROVISION: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Paths for the run
        shell: bash
        run: |
          {
            echo "WASIFYAI_DATA_DIR=$RUNNER_TEMP/wasifyai-data"
            echo "WASIFYAI_COMFYUI_DATA_DIR=$RUNNER_TEMP/wasifyai-data"
            echo "WASIFYAI_SMOKE_OUT=$RUNNER_TEMP/smoke.txt"
          } >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @wasifyai/desktop build
      - name: Engine bundle (with the ComfyUI lock)
        run: ./scripts/build-engine-bundle.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Set up image generation in the window
        working-directory: apps/desktop/src-tauri
        run: cargo run --locked
      - name: Start the installed ComfyUI and ask what it found
        run: |
          uv sync --all-packages
          uv run pytest -s services/media-worker/tests/integration/test_comfyui_installed.py
      - if: always()
        name: Verdict and installer log
        run: |
          echo "--- self-test"; cat "$WASIFYAI_SMOKE_OUT" || true
          echo "--- installer log"; tail -n 60 "$WASIFYAI_DATA_DIR/logs/provision.log" || true
