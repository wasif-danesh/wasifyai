name: desktop
# ADR-0056: macOS, Windows and Linux from day one. The engine tests run the desktop profile (SQLite, the
# in-process queue, local files); the shell job type-checks and builds the window and builds the Tauri shell.
# No signing and no installer in Phase 1.
on:
  workflow_dispatch:
  push:
    paths:
      - apps/desktop/**
      - apps/web/**
      - services/api/**
      - services/media-worker/**
      - packages/**
      - products/wasifyai-image/**
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  pull_request:
    paths:
      - apps/desktop/**
      - apps/web/**
      - services/api/**
      - services/media-worker/**
      - packages/**
      - products/wasifyai-image/**
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml

# The runners carry several Pythons (macOS: a 3.15 pre-release some wheels do not exist for); the engine
# is 3.12, like the installer's pin.
env:
  UV_PYTHON: "3.12"

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - name: Engine tests under the desktop profile
        run: >
          uv run pytest -v
          packages/platform-sdk/tests/test_sqlite_adapters.py
          packages/platform-sdk/tests/test_storage.py
          services/api/tests/test_sqlite_stores.py
          services/api/tests/test_desktop_profile.py
          services/api/tests/test_local_embedder.py
          products/wasifyai-image/tests/test_image_sqlite.py

  shell:
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults:
      run: { working-directory: apps/desktop/src-tauri }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
        working-directory: .
      - name: Build the window
        run: pnpm --filter @wasifyai/desktop build
        working-directory: .
      - name: Window and shared package tests
        run: pnpm --filter @wasifyai/desktop --filter @wasifyai/ui --filter @wasifyai/client test
        working-directory: .
      - if: runner.os == 'Linux'
        name: System libraries for the webview
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: cargo test --locked
      - run: cargo build --release --locked

  smoke:
    # The whole window, as a person would use it: make an image, exit 0 or 1 (apps/desktop/src/smoke.ts).
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @wasifyai/desktop build
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - if: runner.os != 'Linux'
        name: Self-test
        working-directory: apps/desktop/src-tauri
        env: { WASIFYAI_SMOKE: "1" }
        run: cargo run --locked
      - if: runner.os == 'Linux'
        name: Self-test (virtual display)
        working-directory: apps/desktop/src-tauri
        env:
          WASIFYAI_SMOKE: "1"
          # no GPU on a hosted runner: WebKitGTK must not try to use one
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a cargo run --locked

  install:
    # A clean install, as a first run does it: build the engine bundle, let the app download uv and Python
    # and install the packages into an empty folder, then make an image in the window.
    strategy:
      fail-fast: false
      matrix: { os: [macos-latest, ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - run: pnpm --filter @wasifyai/desktop build
      - name: Engine bundle
        shell: bash
        run: ./scripts/build-engine-bundle.sh
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Install and self-test
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          WASIFYAI_SMOKE: "1"
          WASIFYAI_PROVISION: "1"
          WASIFYAI_DATA_DIR: ${{ runner.temp }}/wasifyai-data
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a cargo run --locked; else cargo run --locked; fi
      - if: always()
        name: Installer log
        shell: bash
        run: cat "${{ runner.temp }}/wasifyai-data/logs/provision.log" || true

  package:
    # The packaged app: the engine bundle inside the app's resources, a first run on a machine with no
    # checkout (WASIFYAI_REPO points nowhere), the self-test, and the numbers it prints (SMOKE_METRICS:
    # time to ready with the install included, engine and shell memory). Unsigned: no signing in Phase 1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, bundles: app }
          - { os: ubuntu-latest, bundles: deb }
          - { os: windows-latest, bundles: nsis }
    runs-on: ${{ matrix.os }}
    env:
      WASIFYAI_REPO: ${{ runner.temp }}/no-checkout
      WASIFYAI_SMOKE: "1"
      WASIFYAI_DATA_DIR: ${{ runner.temp }}/wasifyai-data
      WASIFYAI_SMOKE_OUT: ${{ runner.temp }}/smoke.txt
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install
      - name: Engine bundle
        shell: bash
        run: ./scripts/build-engine-bundle.sh
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev patchelf xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec tauri build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}
      - name: What was built
        shell: bash
        run: find apps/desktop/src-tauri/target/release/bundle -maxdepth 3 \( -name '*.app' -o -name '*.deb' -o -name '*.exe' \) -exec du -sh {} +

      - if: runner.os == 'macOS'
        name: Run the packaged app (first run installs the engine)
        shell: bash
        run: |
          app=$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
          "$app/Contents/MacOS/wasifyai-desktop"
          echo "--- second run, already installed"
          "$app/Contents/MacOS/wasifyai-desktop"
      - if: runner.os == 'Linux'
        name: Run the packaged app (first run installs the engine)
        shell: bash
        run: |
          deb=$(ls apps/desktop/src-tauri/target/release/bundle/deb/*.deb | head -1)
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          exe="$RUNNER_TEMP/deb-root/usr/bin/wasifyai-desktop"
          xvfb-run -a "$exe"
          echo "--- second run, already installed"
          xvfb-run -a "$exe"
      - if: runner.os == 'Windows'
        name: Install and run the packaged app (first run installs the engine)
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "wasifyai-app"
          Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$dir" -Wait
          $exe = Join-Path $dir "wasifyai-desktop.exe"
          # a release build is a Windows-subsystem program: start it and wait, then read its verdict file
          foreach ($run in "first", "second (already installed)") {
            $p = Start-Process -FilePath $exe -Wait -PassThru
            Write-Host "$run run exited with $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { throw "$run run failed" }
          }
      - if: always()
        name: Verdicts and installer log
        shell: bash
        run: |
          echo "--- self-test lines"; cat "$WASIFYAI_SMOKE_OUT" || true
          echo "--- installer log"; cat "$WASIFYAI_DATA_DIR/logs/provision.log" || true
