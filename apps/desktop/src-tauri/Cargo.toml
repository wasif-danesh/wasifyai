[package]
name = "wasifyai-desktop"
# two binaries live here (the shell and the wasify-mcp launcher): `cargo run` and `tauri dev` start the shell
default-run = "wasifyai-desktop"
version = "0.0.0"
description = "wasifyai desktop shell: starts the engine and shows the app"
authors = ["Wasif Danesh"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.89"

# This folder is its own Cargo workspace: the repository root is not a Rust project.
[workspace]

[dependencies]
# "unstable" gives a second webview inside the window (the Browser tab of a coding session)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "io-std", "time", "macros", "sync", "fs", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
log = "0.4"
env_logger = "0.11"
# recording a meeting (ADR-0108, MT2): the microphone everywhere, the computer's sound on Windows
# (WASAPI loopback), and the two channels written as a WAV
cpal = "0.15"
hound = "3.5"

# the menu bar item that keeps the app open for scheduled runs: a Mac only, like the switch itself
# (elsewhere it would need system packages the builds do not have)
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# the computer's sound through a Core Audio process tap (ADR-0108), at the commit Meetily pins
cidre = { git = "https://github.com/yury/cidre", rev = "a9587fa", features = ["av"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

# the stdio launcher MCP clients run to reach the engine (ADR-0069); built beside the shell
[[bin]]
name = "wasify-mcp"
path = "src/bin/wasify_mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
