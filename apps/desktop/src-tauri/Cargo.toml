[package]
name = "wasifyai-desktop"
version = "0.0.0"
description = "wasifyai desktop shell: starts the engine and shows the app"
authors = ["Wasif Danesh"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.89"

# This folder is its own Cargo workspace: the repository root is not a Rust project.
[workspace]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "time", "macros", "sync", "fs", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
log = "0.4"
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
