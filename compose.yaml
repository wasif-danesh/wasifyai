services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: wasifyai, POSTGRES_PASSWORD: wasifyai, POSTGRES_DB: wasifyai }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasifyai -d wasifyai"]
      interval: 3s
      retries: 30
  redis:
    image: redis:7
    ports: ["6379:6379"]
  # S3-compatible object storage (SeaweedFS; MinIO's community image was withdrawn, ADR-0017).
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"wasifyai","credentials":[{"accessKey":"$$STORAGE_ACCESS_KEY","secretKey":"$$STORAGE_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=20 -master.volumeSizeLimitMB=256 -ip.bind=0.0.0.0
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?run make setup}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?run make setup}
    ports: ["8333:8333"]
    volumes: ["seaweeddata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/ || exit 1"]
      interval: 5s
      retries: 30
  seaweedfs-init:
    image: docker.io/chrislusf/seaweedfs:latest
    depends_on: [seaweedfs]
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          echo "s3.bucket.create -name $${STORAGE_BUCKET}" | weed shell -master=seaweedfs:9333 2>&1 | grep -qiE "created|exist" && exit 0
          sleep 2
        done
        exit 1
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-wasifyai}
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # The model aliases live in LiteLLM's database (its own schema in our Postgres) and are seeded
    # and managed by the API (ADR-0025). The salt key encrypts provider API keys stored there:
    # set it once and never change it.
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run make setup}
      DATABASE_URL: postgresql://wasifyai:wasifyai@postgres:5432/wasifyai?schema=litellm
      STORE_MODEL_IN_DB: "True"
    volumes: ["./deploy/compose/litellm.yaml:/app/config.yaml:ro"]
    ports: ["4000:4000"]
  api:
    build: { context: ., dockerfile: services/api/Containerfile }
    env_file: .env
    depends_on: [postgres, redis, litellm, seaweedfs]
    ports: ["8000:8000"]
  media-worker:
    build: { context: ., dockerfile: services/media-worker/Containerfile }
    env_file: .env
    # COMFYUI_MODE=stub (the default in .env.example) returns placeholder files, so the whole
    # media flow works without ComfyUI or a GPU. Set COMFYUI_MODE=real to use ComfyUI at
    # COMFYUI_BASE_URL (native ComfyUI on the host: http://host.containers.internal:8188).
    depends_on: [redis, postgres, seaweedfs]
  web:
    build: { context: ., dockerfile: apps/web/Containerfile }
    env_file: .env
    depends_on: [api]
    ports: ["3000:3000"]
volumes: { pgdata: {}, seaweeddata: {} }
