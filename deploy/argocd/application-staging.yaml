# Argo CD Application for staging (home lab k3s). Apply once after Argo CD is installed:
#   kubectl apply -f deploy/argocd/application-staging.yaml
# Prerequisite: the Secret `wasifyai-secrets` exists in the `wasifyai` namespace
#   (scripts/k8s-secrets.sh wasifyai). Secrets are never stored in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wasifyai-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wasif-danesh/wasifyai.git
    targetRevision: main
    path: deploy/helm/wasifyai
    helm:
      releaseName: wasifyai
      valueFiles:
        - values/staging.yaml
        - values/cloud/homelab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: wasifyai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
