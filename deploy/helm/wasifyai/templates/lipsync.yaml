{{- if .Values.lipsync.enabled }}
# The lip sync server (ADR-0044): MuseTalk behind POST /v1/lipsync. The model files are fetched on first start into
# the volume (about 4 GB), so the pod becomes ready only when they are in place and the server is up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-lipsync
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # keep the downloaded models across upgrades
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.lipsync.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.lipsync.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-lipsync
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "wasifyai.selector" (dict "root" . "component" "lipsync") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "wasifyai.selector" (dict "root" . "component" "lipsync") | nindent 8 }}
    spec:
      {{- with .Values.lipsync.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.lipsync.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: lipsync
          image: {{ include "wasifyai.image" (dict "root" . "name" "lipsync-musetalk") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: LIPSYNC_DEVICE, value: {{ .Values.lipsync.device | quote }} }
          ports: [{ name: http, containerPort: 8000 }]
          startupProbe:                       # first start downloads the models (can take long)
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 720
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          volumeMounts: [{ name: models, mountPath: /opt/musetalk/models }]
          resources:
            {{- $r := deepCopy .Values.lipsync.resources }}
            {{- if .Values.lipsync.gpuResources }}
            {{- $_ := set $r "limits" (merge (default (dict) $r.limits) .Values.lipsync.gpuResources) }}
            {{- end }}
            {{- toYaml $r | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-lipsync }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-lipsync
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  selector: {{- include "wasifyai.selector" (dict "root" . "component" "lipsync") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- end }}
