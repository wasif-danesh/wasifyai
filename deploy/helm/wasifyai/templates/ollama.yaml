{{- if and .Values.ollama.enabled (not .Values.ollama.externalUrl) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # keep downloaded models across upgrades/uninstalls
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.ollama.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.ollama.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "wasifyai.selector" (dict "root" . "component" "ollama") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "wasifyai.selector" (dict "root" . "component" "ollama") | nindent 8 }}
    spec:
      {{- with .Values.ollama.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ollama.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image }}
          # Serve, then pull any missing model into the volume. Ready only once models exist.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              pid=$!
              until ollama list >/dev/null 2>&1; do sleep 1; done
              for m in $MODELS; do
                ollama list | grep -q "^$m" || ollama pull "$m" || exit 1
              done
              touch /tmp/ready
              wait $pid
          env:
            - { name: MODELS, value: {{ include "wasifyai.ollamaModels" . | quote }} }
          ports: [{ name: http, containerPort: 11434 }]
          startupProbe:                       # first start downloads the model (can take long)
            exec: { command: ["test", "-f", "/tmp/ready"] }
            periodSeconds: 10
            failureThreshold: 720
          readinessProbe:
            exec: { command: ["test", "-f", "/tmp/ready"] }
            periodSeconds: 10
          volumeMounts: [{ name: models, mountPath: /root/.ollama }]
          resources:
            {{- $r := deepCopy .Values.ollama.resources }}
            {{- if .Values.ollama.gpuResources }}
            {{- $_ := set $r "limits" (merge (default (dict) $r.limits) .Values.ollama.gpuResources) }}
            {{- end }}
            {{- toYaml $r | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-ollama }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ollama
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  selector: {{- include "wasifyai.selector" (dict "root" . "component" "ollama") | nindent 4 }}
  ports: [{ name: http, port: 11434, targetPort: http }]
{{- end }}
