{{- if .Values.speech.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-speech
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # keep downloaded voice and Whisper models across upgrades
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.speech.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources: { requests: { storage: {{ .Values.speech.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-speech
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "wasifyai.selector" (dict "root" . "component" "speech") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "wasifyai.selector" (dict "root" . "component" "speech") | nindent 8 }}
    spec:
      containers:
        - name: speech
          image: {{ .Values.speech.image }}
          env:
            - { name: WHISPER__COMPUTE_TYPE, value: {{ .Values.speech.whisperComputeType | quote }} }
            - { name: LOG_LEVEL, value: {{ .Values.env.LOG_LEVEL | quote }} }
          ports: [{ name: http, containerPort: 8000 }]
          volumeMounts:
            - { name: models, mountPath: /home/ubuntu/.cache/huggingface/hub }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.speech.resources | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-speech }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-speech
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  selector: {{- include "wasifyai.selector" (dict "root" . "component" "speech") | nindent 4 }}
  ports: [{ name: http, port: 8000, targetPort: http }]
{{- end }}
