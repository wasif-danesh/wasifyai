{{- if .Values.storage.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-storage
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-storage
  replicas: 1
  selector:
    matchLabels: {{- include "wasifyai.selector" (dict "root" . "component" "storage") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "wasifyai.selector" (dict "root" . "component" "storage") | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ .Values.storage.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /tmp/s3.json <<EOS
              {"identities":[{"name":"wasifyai","credentials":[{"accessKey":"$STORAGE_ACCESS_KEY","secretKey":"$STORAGE_SECRET_KEY"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
              EOS
              exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
                -volume.max=20 -master.volumeSizeLimitMB=256 -ip.bind=0.0.0.0
          env:
            - { name: STORAGE_ACCESS_KEY, value: {{ .Values.storage.accessKey | quote }} }
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.existingSecret }}, key: STORAGE_SECRET_KEY }
          ports: [{ name: s3, containerPort: 8333 }]
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
          resources: {{- toYaml .Values.storage.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.storage.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-storage
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  selector: {{- include "wasifyai.selector" (dict "root" . "component" "storage") | nindent 4 }}
  ports: [{ name: s3, port: 8333, targetPort: s3 }]
---
# Creates the bucket once the store is up (retries until it is).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-storage-init
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-bucket
          image: {{ .Values.storage.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              for i in $(seq 1 60); do
                out=$(echo "s3.bucket.create -name {{ .Values.storage.bucket }}" \
                  | weed shell -master={{ .Release.Name }}-storage-master:9333 2>&1)
                echo "$out" | grep -qiE "created|exist" && { echo "bucket ready"; exit 0; }
                echo "attempt $i: $(echo "$out" | tail -n 1)"
                sleep 2
              done
              exit 1
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-storage-master
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  selector: {{- include "wasifyai.selector" (dict "root" . "component" "storage") | nindent 4 }}
  # `weed shell` speaks gRPC on the master port + 10000, so both must be reachable
  ports:
    - { name: master, port: 9333, targetPort: 9333 }
    - { name: master-grpc, port: 19333, targetPort: 19333 }
{{- end }}
