apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {{- include "wasifyai.selector" (dict "root" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "wasifyai.selector" (dict "root" . "component" "web") | nindent 8 }}
    spec:
      {{- include "wasifyai.pullSecrets" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "wasifyai.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: API_BASE_URL, value: "http://{{ .Release.Name }}-api:8000" }
            {{- include "wasifyai.webAuthEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          securityContext: { allowPrivilegeEscalation: false }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector: {{- include "wasifyai.selector" (dict "root" . "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "wasifyai.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }} host: {{ . | quote }}{{ end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ .Release.Name }}-web, port: { number: 3000 } }
{{- end }}
