# Base values. Overlay order (later wins):
#   values.yaml  ->  values/<env>.yaml  ->  values/cloud/<cloud>.yaml
# Secrets never live here. They come from the Secret named by `secrets.existingSecret`
# (keys: LITELLM_API_KEY, LITELLM_SALT_KEY, MEDIA_SECRETS_KEY, POSTGRES_PASSWORD, and DATABASE_URL + LITELLM_DATABASE_URL when postgres.enabled=false;
# AUTH_SECRET and API_AUTH_SECRET unless auth.mode=stub; optional AUTH_<PROVIDER>_ID / _SECRET).

image:
  registry: ghcr.io/wasif-danesh/wasifyai   # <registry>/<api|web|media-worker>:<tag>
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []                        # e.g. [{name: ghcr-pull}] if images are private

secrets:
  existingSecret: wasifyai-secrets

env:
  LOG_LEVEL: INFO
  PRODUCT_ENV: ""                        # selects products/<id>/product.<env>.yaml overlays (the kind overlay: kind)
  COMFYUI_BASE_URL: ""                   # Phase 4
  COMFYUI_VIDEO_BASE_URL: ""             # a separate ComfyUI for video (ADR-0037); empty = the one above

safeguards:
  forceOn: false        # true in production (ADR-0047): moderation and quotas always apply, the admin cannot turn them off

auth:
  mode: jwt             # jwt = real sign-in; stub = every request is the dev user (local clusters only)
  adminEmails: ""       # comma-separated; only a verified email becomes admin
  url: ""               # REQUIRED unless mode=stub: public origin of the web app, e.g. https://music.example.com
                        # (without it the OAuth callback address is built from the pod's 0.0.0.0)

api:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

web:
  replicas: 1
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

# Products that run only on the web profile (docs/phase3-web-parity-plan.md). Off until the pieces they need are
# there: notebooks need the worker below and the gateway's `creation-embedder` alias; voice needs the gateway's
# `voice-speak` and `voice-transcribe` aliases bound to a speech provider in the admin Models page (the provider
# receives the text and the recordings). Both need object storage and the platform Postgres (with pgvector).
notebooks:
  enabled: false
  schema: notebooks
  embedModel: creation-embedder
  embedDimension: 1024
  # Reads the sources people add and makes the Studio outputs. Any number can run; the database is the queue.
  # The image holds the document reader and its models (about 1.5 GB on disk) and needs memory to read a page.
  worker:
    replicas: 1
    resources:
      requests: { cpu: 250m, memory: 1Gi }
      limits: { memory: 4Gi }
voice:
  enabled: false
  schema: voice
  modelsFile: ""        # your own descriptors; empty = the product's hosted-models.yaml

mediaWorker:
  enabled: true
  replicas: 1
  # stub: placeholder images/audio, no GPU or ComfyUI. real: drive ComfyUI (set comfyui.enabled or
  # env.COMFYUI_BASE_URL). One job at a time per GPU id; workers sharing a GPU share `gpuId`.
  comfyuiMode: stub
  gpuId: gpu0
  jobTimeoutSeconds: 900
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

litellm:
  image: ghcr.io/berriai/litellm:main-stable
  # The model aliases live in LiteLLM's database (its own schema in the platform Postgres) and are
  # seeded and managed by the API (ADR-0025); defaults: services/api/src/wasifyai_api/model_defaults.yaml.
  # With postgres.enabled=false the Secret needs LITELLM_DATABASE_URL (postgresql://...?schema=litellm).
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 2Gi }

ollama:
  enabled: true
  externalUrl: ""                        # set to use an Ollama outside the cluster
  # What the pod pulls. Keep in step with the `ollama_chat/` and `ollama/` models in
  # services/api/src/wasifyai_api/model_defaults.yaml (a test checks this).
  models: ["gemma4:e4b", "nomic-embed-text", "bge-m3"]
  image: ollama/ollama:latest
  storage: 20Gi
  storageClass: ""
  resources:
    requests: { cpu: "1", memory: 6Gi }
    limits: { memory: 12Gi }
  # GPU: set e.g. { "nvidia.com/gpu": 1 } in a cloud overlay (Phase 4)
  gpuResources: {}
  nodeSelector: {}
  tolerations: []

postgres:
  enabled: true                          # false -> managed DB; provide DATABASE_URL in the Secret
  image: pgvector/pgvector:pg16
  database: wasifyai
  user: wasifyai
  storage: 5Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }

# S3-compatible object storage for generated media (SeaweedFS). Set enabled=false to use an
# external bucket: then provide endpoint, and STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY in the Secret.
storage:
  enabled: true
  image: docker.io/chrislusf/seaweedfs:latest   # pin to a version before relying on it
  bucket: wasifyai
  region: us-east-1
  accessKey: wasifyai          # an id, not a secret; the secret key is STORAGE_SECRET_KEY in the Secret
  size: 10Gi
  storageClass: ""
  endpoint: ""              # external endpoint when enabled=false
  publicEndpoint: ""        # URL browsers use for presigned links, if different from the above
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 1Gi }

# ComfyUI for real media generation. No image is chosen for you: build or pick one that matches
# your GPU and set `image`. Requires the NVIDIA GPU Operator (see docs/runbooks/homelab-k3s.md).
comfyui:
  enabled: false
  image: ""
  port: 8188
  # Extra arguments for ComfyUI. The image defaults to --cpu; on a GPU host set args: "" (see services/comfyui).
  storage: 40Gi             # models and outputs
  storageClass: ""
  gpuResources: { nvidia.com/gpu: 1 }
  resources:
    requests: { cpu: "1", memory: 8Gi }
    limits: { memory: 24Gi }
  nodeSelector: {}
  tolerations: []

# Monitoring (ADR-0048). The monitoring stack itself is installed separately (scripts/monitoring-up.sh); this
# chart only describes what to scrape and when to alert. The objects are created only when the cluster has the
# Prometheus Operator CRDs, so a plain cluster still installs.
metrics:
  enabled: true
  releaseLabel: monitoring    # the kube-prometheus-stack release name: its Prometheus selects objects by it
  alerts:
    workerDownFor: 2m         # shorter than the ADR's example so a drill is quick; tune per environment
    queueStuckFor: 10m
    failureRatioCritical: "0.5"
    failureRatioWarning: "0.2"
    volumeFullPercent: 90

redis:
  enabled: true
  image: redis:7
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []
