# Local kind cluster (make kind-up). Images are built locally and loaded into the node.
image:
  registry: localhost/wasifyai
  tag: dev
  pullPolicy: Never

auth:
  mode: stub               # no OAuth apps on a laptop cluster

web:
  service:
    type: NodePort
    nodePort: 30080          # mapped to localhost:3000 by deploy/kind/cluster.yaml

postgres:
  storage: 1Gi

# No keys on a laptop cluster: placeholder pictures and clips
mediaWorker:
  comfyuiMode: stub
