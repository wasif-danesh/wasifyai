# Local kind cluster (make kind-up). Images are built locally and loaded into the node.
image:
  registry: localhost/wasifyai
  tag: dev
  pullPolicy: Never

auth:
  mode: stub               # no OAuth apps on a laptop cluster

web:
  service:
    type: NodePort
    nodePort: 30080          # mapped to localhost:3000 by deploy/kind/cluster.yaml

# Use the Ollama already running natively on the Mac. scripts/kind-up.sh sets
# ollama.externalUrl to an address the cluster can reach.
ollama:
  enabled: false

postgres:
  storage: 1Gi

# No GPU on a laptop cluster: ComfyUI (when enabled) must not ask for one.
comfyui:
  gpuResources: null

# kind on a laptop: the Indic servers fit next to everything else only with small requests (limits unchanged)
speechIndic:
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 8Gi }
sttIndic:
  resources:
    requests: { cpu: 500m, memory: 2Gi }
    limits: { memory: 6Gi }
