<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code in Wasify AI: mockups of every screen</title>
<!--
  Mockups of the coding agent's screens (ADR-0101 to ADR-0105; docs/v2-coding-agent-start-plan.md, sections 2, 6 and 7).
  One self-contained file: no network, no web font, no outside picture. Nothing here is a real screen.
  The colours, radii, shadow and fonts are the app's own tokens, copied from packages/ui/src/tokens.generated.css;
  the menu is MENU_GROUPS from packages/ui/src/shell/menu.ts with the proposed "Code" group added.
  Notes for the owner, the open choices and what could not be drawn: docs/spikes/coding-mockups.md
  Address: coding-mockups.html#<screen>  ·  ?s=<screen>&theme=dark&size=small&bare=1 shows one window alone.
-->
<style>
  /* ---------------------------------------------------------------- the app's tokens (design/DESIGN.md, template blue 1.0.0) */
  :root {
    --bg: light-dark(oklch(97% 0.004 250), oklch(15% 0.012 255));
    --surface: light-dark(oklch(100% 0 0), oklch(21% 0.014 255));
    --surface-2: light-dark(oklch(96% 0.006 250), oklch(26% 0.016 255));
    --text: light-dark(oklch(21% 0.02 255), oklch(95% 0.006 250));
    --muted: light-dark(oklch(49% 0.02 255), oklch(70% 0.016 255));
    --border: light-dark(oklch(90% 0.01 250), oklch(34% 0.018 255));
    --accent: light-dark(oklch(50% 0.17 258), oklch(76% 0.12 250));
    --on-accent: light-dark(oklch(99% 0 0), oklch(19% 0.04 250));
    --accent-soft: color-mix(in oklch, var(--accent) 10%, transparent);
    --ok: light-dark(oklch(52% 0.125 155), oklch(76% 0.15 155));
    --warn: light-dark(oklch(58% 0.12 70), oklch(82% 0.13 80));
    --danger: light-dark(oklch(55% 0.19 25), oklch(74% 0.14 25));
    --scrim: oklch(20% 0.03 255 / 0.84);
    --radius-sm: 0.5rem;
    --radius: 0.85rem;
    --radius-lg: 1.15rem;
    --radius-control: 0.65rem;
    --shadow: 0 1px 2px oklch(22% 0.03 255 / 0.05), 0 12px 30px -16px oklch(30% 0.08 255 / 0.22);
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --ring: color-mix(in oklch, var(--accent) 60%, transparent);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  p, h1, h2, h3, h4, ul, ol, dl, dd, pre, figure { margin: 0; }
  ul, ol { padding: 0; list-style: none; }

  /* ---------------------------------------------------------------- the page around the window (not part of the app) */
  body { background: oklch(13% 0.01 255); color: oklch(86% 0.01 255); font: 14px/1.45 var(--font); }
  .mock { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }
  .rail { border-inline-end: 1px solid oklch(26% 0.012 255); padding: 16px 10px 40px; position: sticky; top: 0; height: 100vh; overflow: auto; }
  .rail h1 { font-size: 15px; font-weight: 650; color: oklch(96% 0.005 255); padding: 0 8px 2px; }
  .rail .sub { font-size: 12px; color: oklch(68% 0.012 255); padding: 0 8px 12px; }
  .rail h2 { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: oklch(64% 0.012 255); padding: 12px 8px 4px; font-weight: 600; }
  .rail button { display: block; width: 100%; text-align: start; border: 0; background: transparent; color: oklch(84% 0.01 255); border-radius: 7px; padding: 5px 8px; font-size: 13px; }
  .rail button:hover { background: oklch(21% 0.012 255); }
  .rail button[aria-current=true] { background: oklch(28% 0.04 255); color: white; font-weight: 600; }
  .stagearea { padding: 16px 22px 60px; min-width: 0; }
  .ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .ctl .grp { display: inline-flex; border: 1px solid oklch(30% 0.014 255); border-radius: 999px; padding: 2px; background: oklch(18% 0.012 255); }
  .ctl .grp button { border: 0; background: transparent; color: oklch(72% 0.012 255); border-radius: 999px; padding: 4px 13px; font-size: 13px; }
  .ctl .grp button[aria-pressed=true] { background: oklch(32% 0.02 255); color: white; font-weight: 600; }
  .ctl .plain { border: 1px solid oklch(30% 0.014 255); background: oklch(18% 0.012 255); color: oklch(88% 0.01 255); border-radius: 999px; padding: 5px 13px; font-size: 13px; }
  .ctl .where { margin-inline-start: auto; color: oklch(66% 0.012 255); font-size: 12.5px; }
  .cap { max-width: 1100px; margin-bottom: 12px; }
  .cap h2 { font-size: 17px; font-weight: 650; color: oklch(97% 0.004 255); }
  .cap p { color: oklch(74% 0.012 255); margin-top: 3px; max-width: 86ch; }
  .frame { width: fit-content; max-width: 100%; overflow: auto; border-radius: 12px; border: 1px solid oklch(30% 0.014 255); box-shadow: 0 30px 80px -40px black; }
  .allgrid { display: grid; gap: 34px; }
  .allgrid .cap h2 { font-size: 14px; }
  body.bare { background: transparent; }
  body.bare .mock { display: block; min-height: 0; }
  body.bare .rail, body.bare .ctl, body.bare .cap { display: none; }
  body.bare .stagearea { padding: 0; }
  body.bare .frame { border: 0; border-radius: 0; box-shadow: none; overflow: visible; }
  body.bare .win { border-radius: 0; }

  /* ---------------------------------------------------------------- the window */
  .win { color-scheme: light; width: 1100px; height: 760px; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; position: relative; container: win / size; -webkit-font-smoothing: antialiased; }
  .win[data-theme=dark] { color-scheme: dark; }
  .win[data-size=small] { width: 720px; height: 520px; }
  .win *, .win ::before, .win ::after { border-color: var(--border); }
  .win :focus-visible { outline: 3px solid var(--ring); outline-offset: 1px; }
  .ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ic.s12 { width: 12px; height: 12px; } .ic.s14 { width: 14px; height: 14px; } .ic.s20 { width: 20px; height: 20px; } .ic.s24 { width: 24px; height: 24px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .spin, .slide i { animation: none !important; } }
  .muted { color: var(--muted); }
  .sm { font-size: .875rem; } .xs { font-size: .75rem; } .ui { font-size: .9rem; }
  .mono { font-family: var(--mono); font-size: .8125rem; }
  code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); border-radius: 5px; padding: .08em .35em; overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row.wrap { flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .row.top { align-items: flex-start; }
  .grow { flex: 1; min-width: 0; }
  .end { margin-inline-start: auto; }
  .stack { display: grid; gap: 8px; min-width: 0; align-content: start; }
  .stack.g4 { gap: 4px; } .stack.g12 { gap: 12px; } .stack.g16 { gap: 16px; } .stack.g24 { gap: 24px; }
  .trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .nowrap { white-space: nowrap; }
  .strong { font-weight: 600; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* the one top bar (AppBar, 48 px) */
  .appbar { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 60%, transparent); padding-inline-end: 8px; min-width: 0; }
  .appbar .nav { height: 100%; display: flex; align-items: center; gap: 2px; padding-inline: 84px 4px; position: relative; flex: none; }
  .win[data-menu=open] .appbar .nav { width: 256px; border-inline-end: 1px solid var(--border); }
  .lights { position: absolute; inset-inline-start: 18px; top: 18px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; background: oklch(70% 0.02 255 / .55); }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .tool { width: 28px; height: 28px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: var(--radius-sm); }
  .tool:hover { background: var(--accent-soft); color: var(--text); }
  .tool[disabled] { opacity: .4; }
  .appbar .title { font-weight: 600; font-size: .875rem; padding-inline-start: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 2.5rem; flex: 0 1 auto; display: flex; align-items: center; gap: 6px; }
  .appbar .title .t { overflow: hidden; text-overflow: ellipsis; flex: none; max-width: 14rem; }
  .appbar .title .sep { color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .appbar .title .ic { flex: none; }
  .appbar .slot { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 0 1 auto; }
  .appbar .right { margin-inline-start: auto; display: flex; align-items: center; gap: 4px; flex: none; }
  .barbtn { height: 32px; display: inline-flex; align-items: center; gap: 8px; border: 0; background: transparent; color: var(--muted); border-radius: var(--radius-sm); padding: 0 8px; font-size: .875rem; white-space: nowrap; }
  .barbtn:hover { background: var(--accent-soft); color: var(--text); }
  .kbd { border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: .75rem; font-family: inherit; }
  .model { flex: none; height: 32px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: transparent; border-radius: var(--radius-sm); padding: 0 10px; font-size: .875rem; font-weight: 600; white-space: nowrap; min-width: 0; }
  .model .nm { overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: color-mix(in oklch, var(--muted) 45%, transparent); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--danger); }
  .status { height: 28px; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 0 10px; font-size: .75rem; font-weight: 600; white-space: nowrap; color: var(--text); }
  .status .ic { width: 14px; height: 14px; }
  .t-ok { --tone: var(--ok); } .t-bad { --tone: var(--danger); } .t-warn { --tone: var(--warn); } .t-info { --tone: var(--accent); } .t-quiet { --tone: var(--muted); }
  .status .ic, .tone { color: var(--tone, var(--muted)); }
  .cost { margin-inline-end: 6px; height: 28px; display: inline-flex; align-items: center; border: 0; background: transparent; border-radius: 999px; padding: 0 8px; font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .cost:hover { background: var(--accent-soft); color: var(--text); }

  /* the side menu (SideMenu, 256 px) */
  .below { flex: 1; min-height: 0; display: flex; }
  .side { width: 256px; flex: none; border-inline-end: 1px solid var(--border); background: color-mix(in oklch, var(--surface) 60%, transparent); display: flex; flex-direction: column; gap: 4px; padding: 12px; min-height: 0; }
  .win[data-menu=closed] .side { display: none; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 8px; }
  .brand i { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 700; font-size: 1.125rem; font-style: normal; }
  .brand b { font-weight: 600; font-size: 1.25rem; letter-spacing: -.02em; }
  .side .items { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; display: grid; gap: 2px; align-content: start; margin-top: 8px; }
  .mi { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; background: transparent; border-radius: var(--radius-sm); padding: 8px 12px; font-size: .95rem; text-align: start; }
  .mi:hover { background: var(--accent-soft); }
  .mi[aria-current=page] { background: var(--accent-soft); }
  .mi.here { font-weight: 500; }
  .mi .chev { margin-inline-start: auto; color: var(--muted); }
  .subitems { display: grid; gap: 2px; padding-inline-start: 12px; }
  .subitems .mi { padding-block: 6px; font-size: .9rem; }
  .mi .new { margin-inline-start: auto; border: 1px dashed var(--accent); color: var(--accent); border-radius: 999px; padding: 0 7px; font-size: .65rem; text-transform: uppercase; letter-spacing: .04em; }
  .side .foot { display: flex; align-items: center; gap: 12px; padding: 12px 8px 0; }
  .side .foot i { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 600; font-style: normal; flex: none; }
  .side .foot .gear { margin-inline-start: auto; border: 0; background: transparent; color: var(--muted); padding: 8px; border-radius: var(--radius-sm); display: grid; }
  .side .foot .gear[aria-current=page] { background: var(--accent-soft); }
  main.page { flex: 1; min-width: 0; min-height: 0; overflow: auto; position: relative; }

  /* ---------------------------------------------------------------- foundation components (packages/ui/src/components) */
  .btn { display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 20px; border-radius: var(--radius-sm); border: 1px solid transparent; background: var(--accent); color: var(--on-accent); font-size: .875rem; font-weight: 600; white-space: nowrap; box-shadow: 0 5px 16px -8px color-mix(in oklch, var(--accent) 65%, transparent); }
  .btn:hover { filter: brightness(1.1); }
  .btn.sm { height: 32px; padding: 0 12px; gap: 6px; } .btn.xs { height: 24px; padding: 0 8px; gap: 4px; font-size: .75rem; }
  .btn.outline { background: transparent; color: var(--text); border-color: var(--border); box-shadow: none; }
  .btn.secondary { background: var(--surface-2); color: var(--text); box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--text); box-shadow: none; }
  .btn.outline:hover, .btn.ghost:hover { background: var(--accent-soft); filter: none; }
  .btn.danger { background: var(--danger); box-shadow: none; }
  .btn.link { background: transparent; color: var(--accent); box-shadow: none; padding: 0; height: auto; font-weight: 500; }
  .btn.link:hover { text-decoration: underline; filter: none; }
  .btn[disabled] { opacity: .5; pointer-events: none; }
  .btn.icon { width: 32px; padding: 0; }
  .badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; border: 1px solid var(--border); padding: 2px 8px; font-size: .75rem; font-weight: 500; white-space: nowrap; }
  .badge.fill { background: var(--surface-2); border-color: transparent; }
  .badge.tag { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .badge .ic { width: 12px; height: 12px; color: var(--tone, currentColor); }
  .notice { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; border: 1px solid color-mix(in oklch, var(--tone) 30%, transparent); background: color-mix(in oklch, var(--tone) 5%, transparent); border-radius: var(--radius); padding: 14px 18px; }
  .notice > .mark { grid-row: span 2; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in oklch, var(--tone) 20%, transparent); color: var(--tone); font-weight: 800; }
  .notice h3 { font-size: 1.05rem; font-weight: 600; }
  .notice p { color: var(--muted); }
  .notice .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
  .notice.slim { padding: 10px 14px; gap: 2px 12px; font-size: .875rem; }
  .notice.slim h3 { font-size: .9rem; }
  .notice.slim > .mark { width: 24px; height: 24px; font-size: .8rem; }
  .seg { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: color-mix(in oklch, var(--surface-2) 60%, transparent); border-radius: var(--radius-sm); padding: 4px; max-width: 100%; }
  .seg button { height: 28px; border: 0; background: transparent; color: var(--muted); border-radius: 6px; padding: 0 10px; font-size: .75rem; font-weight: 500; white-space: nowrap; }
  .seg button[aria-pressed=true] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px oklch(22% 0.03 255 / .12); }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: transparent; border-radius: var(--radius-sm); padding: .35rem .85rem; font-size: .9rem; }
  .chip:hover { border-color: color-mix(in oklch, var(--accent) 50%, transparent); }
  .chip[aria-pressed=true] { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  .chip.round { border-radius: 999px; padding: 6px 12px; font-size: .875rem; color: var(--muted); }
  .input, .select, .area { width: 100%; min-width: 0; border: 1px solid var(--border); background: transparent; border-radius: var(--radius-sm); padding: 0 12px; height: 36px; font-size: .875rem; display: flex; align-items: center; gap: 8px; }
  .win[data-theme=dark] .input, .win[data-theme=dark] .select, .win[data-theme=dark] .area { background: color-mix(in oklch, var(--border) 30%, transparent); }
  .area { height: auto; padding: 8px 12px; align-items: flex-start; min-height: 72px; line-height: 1.45; }
  .select { justify-content: space-between; text-align: start; }
  .select .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .select .ic { color: var(--muted); }
  .input.mono, .area.mono { font-family: var(--mono); font-size: .8125rem; }
  .ph { color: var(--muted); }
  .field { display: grid; gap: 6px; min-width: 0; }
  .field > .lab { font-size: .875rem; font-weight: 600; }
  .hint { font-size: .8125rem; color: var(--muted); }
  .switch { width: 36px; height: 20px; border-radius: 999px; background: color-mix(in oklch, var(--muted) 40%, transparent); border: 0; padding: 2px; display: inline-flex; flex: none; }
  .switch::after { content: ""; width: 16px; height: 16px; border-radius: 50%; background: white; box-shadow: 0 1px 2px #0004; transition: translate .15s; }
  .switch[aria-checked=true] { background: var(--accent); }
  .switch[aria-checked=true]::after { translate: 16px 0; }
  .check { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); flex: none; display: grid; place-items: center; background: transparent; margin-top: 3px; }
  .check[aria-checked=true] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .check .ic { width: 12px; height: 12px; stroke-width: 3; }
  .radios { display: grid; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
  .radio { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 10px 12px; border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: start; align-items: start; }
  .radio:last-child { border-bottom: 0; }
  .radio .o { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--muted); margin-top: 3px; grid-row: span 2; display: grid; place-items: center; }
  .radio[aria-checked=true] .o { border-color: var(--accent); }
  .radio[aria-checked=true] .o::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .radio b { font-size: .875rem; font-weight: 600; }
  .radio span.d { font-size: .8125rem; color: var(--muted); grid-column: 2; }
  .radio .more { grid-column: 2; margin-top: 6px; }
  .card { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 16px; }
  .card.flat { border-radius: var(--radius-sm); padding: 12px; }
  .progress { height: .6rem; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .progress.slide i { width: 40%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { translate: -100% 0; } to { translate: 250% 0; } }
  .empty { display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty.sm { padding: 24px 12px; }
  .empty .round { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
  .empty h3 { color: var(--text); font-size: 1.125rem; font-weight: 600; }
  .empty.sm h3 { font-size: 1rem; }
  .empty p { font-size: .875rem; max-width: 46ch; }
  .skel { background: linear-gradient(90deg, var(--surface-2) 25%, color-mix(in oklch, var(--surface-2) 50%, var(--surface)) 50%, var(--surface-2) 75%); background-size: 200% 100%; border-radius: 6px; height: 12px; }
  details.experts { border-top: 1px solid var(--border); padding-top: 10px; }
  details.experts > summary { cursor: pointer; font-size: .875rem; font-weight: 600; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 6px; }
  details.experts > summary::-webkit-details-marker { display: none; }
  details.experts[open] > summary .ic { rotate: 90deg; }
  .scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 30; }
  .dialog { width: min(32rem, 100%); max-height: 100%; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 14px; }
  .dialog.wide { width: min(40rem, 100%); }
  .dialog h2 { font-size: 1.125rem; font-weight: 600; }
  .dialog > .acts { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; position: sticky; bottom: -20px; background: var(--surface); margin: 0 -20px -20px; padding: 12px 20px 20px; border-top: 1px solid transparent; }
  @container win (max-height: 600px) { .dialog > .acts { border-top-color: var(--border); } .dialog { gap: 10px; } }

<div class="mock">
  <aside class="rail" id="rail" aria-label="Screens"></aside>
  <div class="stagearea">
    <div class="ctl" id="ctl">
      <span class="grp" role="group" aria-label="Light or dark" id="themeseg">
        <button data-theme="light" aria-pressed="true">Light</button><button data-theme="dark" aria-pressed="false">Dark</button>
      </span>
      <span class="grp" role="group" aria-label="Window size" id="sizeseg">
        <button data-size="usual" aria-pressed="true">Usual window, 1100 × 760</button><button data-size="small" aria-pressed="false">Smallest, 720 × 520</button>
      </span>
      <button class="plain" id="prev">‹ Previous</button><button class="plain" id="next">Next ›</button>
      <button class="plain" id="allbtn">All screens on one page</button>
      <span class="where" id="where"></span>
    </div>
    <div id="stage"></div>
  </div>
</div>
<script>
'use strict';
/* ------------------------------------------------------------------ small helpers */
const ic = (n, c = '') => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const SCREENS = [];
const add = (s) => SCREENS.push(s);

/* ------------------------------------------------------------------ the shell: the real menu (MENU_GROUPS) with the proposed Code group */
const GROUPS = [['notebook', 'Notebook', 'book-open'], ['images', 'Images', 'image'], ['video', 'Video', 'video'], ['voice', 'Voice', 'volume'], ['music', 'Music', 'music']];
const CODE = [['code.projects', 'Projects', 'folder-open', 'projects'], ['code.scheduled', 'Scheduled', 'calendar-clock', 'scheduled'], ['code.extensions', 'Extensions', 'puzzle', 'extensions']];
const EXTRAS = [['creative', 'Creative Studio', 'clapperboard'], ['motion', 'Motion graphics', 'shapes'], ['model3d', '3D model', 'box'], ['library', 'Library', 'library'], ['train', 'Train models', 'flask'], ['models', 'Model hub', 'stack']];

function sideMenu(current) {
  const inCode = current && current.startsWith('code.');
  return `<nav class="side" aria-label="Main">
    <div class="brand"><i aria-hidden="true">w</i><b>Wasify AI</b></div>
    <div class="items">
      <button class="mi">${ic('square-pen')} New chat</button>
      ${GROUPS.map(([, l, i]) => `<button class="mi" aria-expanded="false">${ic(i)} ${l}${ic('chevron-right', 'chev')}</button>`).join('')}
      <button class="mi ${inCode ? 'here' : ''}" aria-expanded="true">${ic('code')} Code${ic('chevron-down', 'chev')}</button>
      <div class="subitems">${CODE.map(([id, l, i, go]) => `<button class="mi" data-go="${go}" ${current === id ? 'aria-current="page"' : ''}>${ic(i)} ${l}</button>`).join('')}</div>
      ${EXTRAS.map(([, l, i]) => `<button class="mi">${ic(i)} ${l}</button>`).join('')}
    </div>
    <div class="foot"><i aria-hidden="true">Y</i><div style="min-width:0;line-height:1.25"><div class="strong trunc">You</div><div class="xs muted trunc">On this computer</div></div>
      <button class="gear" aria-label="Settings" data-go="settings" ${current === 'settings' ? 'aria-current="page"' : ''}>${ic('settings', 's20')}</button></div>
  </nav>`;
}

function tray(n) {
  return `<button class="barbtn" aria-label="Running now">${n ? ic('loader', 's14 spin') : '<span class="dot off"></span>'}<span class="tnum">${n || ''}</span><span class="lbl">${n ? 'Running' : ''}</span></button>`;
}

/** The window's inside: the one top bar, the side menu and the page. */
function shell(o) {
  return `<header class="appbar">
      <div class="nav"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
        <button class="tool" aria-label="Back">${ic('arrow-left')}</button>
        <button class="tool" aria-label="Forward" disabled>${ic('arrow-right')}</button>
        <button class="tool" data-act="menu" aria-label="Show or hide the side menu" title="Show or hide the side menu">${ic('panel-left')}</button>
      </div>
      ${o.slot ?? `<p class="title"><span class="t">${o.title ?? 'Code'}</span></p>`}
      <div class="right">${o.right ?? ''}${tray(o.jobs)}
        <button class="barbtn" aria-label="Search" title="Search (⌘K)">${ic('search')}<span class="lbl">Search</span><kbd class="kbd">⌘K</kbd></button>
        <button class="tool" data-act="theme" aria-label="Switch between the light and dark theme">${ic('moon')}</button>
      </div>
    </header>
    <div class="below">${sideMenu(o.current ?? null)}<main class="page" id="main">${o.body}</main></div>${o.over ?? ''}`;
}

/* ------------------------------------------------------------------ the session's bar: project, model, the check's word, the cost */
const ST = {
  working: ['t-info', 'loader', 'Working', 'spin'],
  checking: ['t-info', 'loader', 'Checking', 'spin'],
  starting: ['t-info', 'loader', 'Starting', 'spin'],
  passed: ['t-ok', 'circle-check', 'Check passed'],
  failed: ['t-bad', 'circle-x', 'Check failed'],
  needs: ['t-bad', 'circle-x', 'Check failed<span class="hidesmall">· needs you</span>'],
  notchecked: ['t-quiet', 'circle-dashed', 'Not checked'],
  couldnot: ['t-warn', 'circle-alert', 'Could not check'],
  waiting: ['t-warn', 'hand', 'Waiting for you'],
  none: ['t-quiet', 'circle-dashed', 'No check run yet'],
};
const chipOf = (k, extra = '') => { const [tone, icon, word, cls] = ST[k]; return `<span class="status ${tone}" ${extra}>${ic(icon, cls ?? '')}${word}</span>`; };

function sessSlot(o = {}) {
  return `<div class="slot"><h1 class="title">${ic('folder', 'muted')}<span class="t">${o.project ?? 'bakery-site'}</span><span class="sep">· ${o.name ?? 'Opening hours on the home page'}</span></h1>
    <button class="model" aria-label="Model: Claude Sonnet 5.5, ready"><span class="dot"></span><span class="nm"><span class="hidesmall">Claude </span>Sonnet 5.5</span>${ic('chevron-down', 's14')}</button>

    <div class="head">${ic('hand')}<span class="word">The agent wants to run a command</span></div>
    <div class="cmd">${cmdText}</div><p>It says: “${says}”</p>
    <p class="muted" style="font-size:.8125rem">Why you are asked: the rule “${rule}”.</p>
    ${state === 'allow' ? `<p class="row muted wrap">${ic('shield', 's14 tone t-ok')}<span>You allowed deleting files for this project · 14:31</span><button class="linkbtn" data-go="project-may">Take it back</button></p>`
      : `<p class="row muted">${state === 'yes' ? ic('check', 'tone t-ok') : ic('x', 's14')}<span>You said ${state} · ${state === 'yes' ? '14:31' : '14:33'}</span></p>`}</section>`;

add({ id: 'ask', g: G4, name: 'The approval card, and the session while it waits', menu: false,
  note: 'In “Ask me”, a command that a rule marks stops for an answer: yes, no, or “Allow for this project”, which runs it and stops asking for that kind of request in this project. The card shows the command, the agent’s reason in its own words, what it does, whether Undo covers it, and the rule. While it waits the bar says “Waiting for you” and nothing else runs.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'Build for the web' }), right: sessRight('waiting', '$0.06'),
    body: session({ tab: 'files', pane: { none: true },
      thread: thread(BUILD_ASK + ai(steps(read('package.json'), read('README.md')), p('The project builds into <code>dist/</code>. An old build is still there, so I will clear it first.'), askCard()), 'toend'),
      composer: { running: true, placeholder: 'Or say what to do instead', note: 'The agent is waiting for your answer. Nothing else runs until then.' } }) }) });

add({ id: 'ask-elsewhere', g: G4, name: 'Waiting, seen from another screen', menu: true,
  note: 'When the person is somewhere else in the app, the question comes to them: a card under the bar, as connection approvals do today, with the same three answers. Projects shows “Waiting for you” on the row.',
  render: () => shell({ current: 'code.projects', body: `<div class="pagepad">
    <div class="pagehead"><div><h1>Projects</h1><p>The folders the agent works in. Each keeps its own sessions, check and extensions.</p></div>
      <button class="btn">${ic('folder-open')} Choose a folder</button></div>
    <div class="stack">
      ${projRow({ name: 'bakery-site', path: '~/Projects/bakery-site', sessions: '4 sessions', tone: 't-warn', icon: 'hand', word: 'Waiting for you', last: 'Build for the web · just now', acts: `<button class="btn sm" data-go="ask">Answer</button>` })}
      ${projRow({ name: 'club-newsletter', path: '~/Documents/club-newsletter', sessions: '7 sessions', tone: 't-bad', icon: 'circle-x', word: 'Check failed · needs you', last: 'Fix the sign-up form · yesterday 18:40' })}
    </div></div>
    <div class="pop" style="top:12px;inset-inline-end:12px;width:min(24rem,calc(100% - 24px));padding:0;border:0;box-shadow:var(--shadow)" role="alertdialog" aria-label="The agent in bakery-site is waiting for you">
      <section class="tcard ask t-warn" style="max-width:none"><div class="head">${ic('hand')}<span class="word">bakery-site is waiting for you</span></div>
        <p>The agent wants to run a command:</p><div class="cmd">rm -rf dist/</div>
        <div class="btns"><button class="btn sm">Yes, run it</button><button class="btn outline sm">Allow for this project</button><button class="btn outline sm">No</button><button class="btn ghost sm" data-go="ask">Open the session</button></div></section></div>` }) });

add({ id: 'ask-answered', g: G4, name: 'After an answer: allowed for the project, and a no', menu: false,
  note: 'An answered card stays in the chat and says what was answered. After “Allow for this project” the command runs, and the next one of that kind runs without a card: it is a quiet line marked “allowed”, never hidden. A kind that was not allowed still asks. After a no the agent is told, and goes on another way or stops.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'Build for the web' }), right: sessRight('working', '$0.11'),
    body: session({ tab: 'terminal',
      thread: thread(BUILD_ASK + ai(askSmall('rm -rf dist/', 'Remove the old build before I build again.', 'Ask before deleting files', 'allow'),
        steps(cmd('rm -rf dist/', '· under 1 s · no errors', '', false), cmd('npm run build', '· 38 s · no errors', '', false),
          cmd('rm -rf .cache/', '· under 1 s · <span class="badge" title="You allowed deleting files for this project">allowed</span>', '', false)),
        p('The build is ready in <code>dist/</code>. The pictures are large; a package called sharp could make them smaller.'),
        askSmall('npm install sharp', 'Install sharp to shrink the pictures.', 'Ask before installing packages', 'no'),
        p('All right, I will not install it. The pictures stay as they are. The site is built and ready.'),
        working('Finishing…')), 'toend'),
      composer: { running: true } }) }) });

const allowRow = (icon, tone, t, d, act) => `<div class="allowrow ${tone}">${ic(icon)}<div><span>${t}</span><span class="d">${d}</span></div>${act ?? '<span></span>'}</div>`;
const mayDialog = () => `<div class="scrim"><div class="dialog" role="dialog" aria-label="What bakery-site may do">
    <h2>What bakery-site may do</h2>
    <div class="field"><span class="lab">How much the agent asks</span>
      <div class="seg" role="group" aria-label="How much the agent asks">${Object.entries(MODES).map(([k, m]) => `<button aria-pressed="${k === 'ask'}">${m.label}</button>`).join('')}</div>
      <span class="hint">In “Ask me” the agent asks before each thing in this list, unless you allowed it.</span></div>
    <div class="allowlist">
      ${allowRow('shield', 't-ok', 'Delete files in this project', 'Allowed without asking · by you, today 14:31, in “Build for the web”', `<button class="btn outline sm">Remove</button>`)}
      ${allowRow('hand', 't-warn', 'Install packages', 'Asks each time', `<button class="btn ghost sm">Allow</button>`)}
    </div>
    <div class="field"><span class="lab">Asked every time, in every mode</span>
      <div class="allowlist">
        ${allowRow('lock', '', 'Deleting something of yours outside this project', 'Such as a picture in your Library')}
        ${allowRow('lock', '', 'Going on after the cost limit is reached', '$2.00 for one session')}
      </div></div>
    <p class="xs muted row top">${ic('info', 's12')}<span>This list is for bakery-site and for you only. Another project starts in “Ask me” with nothing allowed. Whatever is allowed, the agent cannot leave this folder or reach the internet, and what it does is still shown in the chat.</span></p>
    <div class="acts"><button class="btn" data-go="session-done">Done</button></div>
  </div></div>`;
add({ id: 'project-may', g: G4, name: 'What this project may do', menu: false,
  note: 'Where the person sees and takes back what they allowed. Opened from the mode pill, from an answered card’s “Take it back”, and from a project’s “More” on Projects. It holds the mode, each kind of request with “Remove” or “Allow”, and the short list that is asked in every mode.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'Build for the web' }), right: sessRight('passed', '$0.14'), over: mayDialog(),
    body: session({ tab: 'files', n: 3, thread: DONE_THREAD, composer: {} }) }) });

add({ id: 'refusal', g: G4, name: 'The model declines a request', menu: false,
  note: 'When the model itself says no, the person sees that as a plain message with the model’s own words, and the turn ends. It is not an error, the session is not “stuck”, and nothing was changed or run.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'The old admin page' }), right: sessRight('passed', '$0.02'),
    body: session({ tab: 'files', pane: { none: true },
      thread: thread(user('Write a script that tries passwords on the shop’s old admin page until one works.')
        + ai(`<p class="row muted" style="font-size:.8125rem">${ic('circle-slash', 's14')}<span>The model declined this request. In its words:</span></p>`,
          p('I can’t help with trying passwords against a login page. If this is your own page and you are locked out, I can help you reset the password with the project’s own reset script instead.'),
          `<p class="muted" style="font-size:.8125rem">The turn has ended. No file was changed and nothing was run.</p>`, under()), 'toend'),
      composer: {} }) }) });

/* ================================================================== 5 · The tabs */
const G5 = '5 · The tabs';
const DONE_THREAD = thread(ASK + ai(LOOKED, PLAN_P, EDITS, TESTRUN_C, DONE_P, PASSCARD(), under()), 'toend');
const tabScreen = (id, name, note, o = {}) => add({ id, g: G5, name, note, menu: false,
  render: () => shell({ current: 'code.projects', slot: sessSlot(), right: sessRight(o.status ?? 'passed'), over: o.over,
    body: session({ tab: o.tab, small: o.tab, n: 3, pane: o.pane, thread: o.thread ?? DONE_THREAD, composer: {} }) }) });

tabScreen('files', 'Files: browse and read',
  'The project’s folder as a tree, and a file to read. A dot marks what changed in this session. Reading only: changes go through the chat (or the person’s own editor), so every change has a turn that can be undone.', { tab: 'files' });

tabScreen('changes', 'Changes: what this turn changed',
  'One turn at a time: the files it changed, added or deleted, and each file before and after. “Undo this turn” puts every file back. A test file is marked.', { tab: 'changes' });

tabScreen('changes-undone', 'Changes: an undone turn',
  'After Undo the turn stays in the list, marked as undone, with “Bring it back”: an undo can itself be undone. The chat keeps a line for it. The foot says what undo does not put back.', { tab: 'changes', pane: { undone: true },
  thread: thread(ASK + ai(LOOKED, PLAN_P, EDITS, TESTRUN_C, DONE_P, PASSCARD())
    + `<section class="tcard" aria-label="You undid this turn"><div class="head">${ic('undo')}<span class="word">You undid this turn</span></div>
        <p>3 files are back to how they were at 14:02, before the turn.</p><div class="btns"><button class="btn outline sm" data-go="changes">${ic('redo', 's14')} Bring it back</button></div></section>`, 'toend') });

tabScreen('terminal', 'Terminal: the person’s own',
  'A terminal of the person’s own, in the project’s folder, under the same limits as the agent. A note says why ps, top and sudo do not work there, and the same explanation appears in place when one of them is typed.', { tab: 'terminal' });

tabScreen('terminal-processes', 'Terminal: what is running',
  'The app’s own list, in place of ps and top: everything started in this project by the person, the agent or a check, each with Stop.', { tab: 'terminal', over: processes() });

tabScreen('browser', 'Browser',
  'A browser of the person’s own beside the chat, for looking things up. The agent cannot reach the internet; it sees a page only when the person adds it to the chat.', { tab: 'browser' });

tabScreen('preview', 'Preview: the running result',
  'The project started on this computer and shown beside the chat: what is running, a wide and a phone size, load again, stop, and “open in your own browser”.', { tab: 'preview' });

tabScreen('preview-phone', 'Preview: phone size',
  'The same preview at a phone’s width.', { tab: 'preview', pane: { phone: true } });

tabScreen('preview-empty', 'Preview: nothing running yet',
  'Before anything runs: what the preview does, the command it would run, and one button.', { tab: 'preview', pane: { empty: true } });
</script>
<script>
/* ================================================================== 6 · Scheduled */
const G6 = '6 · Scheduled';
const awake = () => `<div class="notice slim t-info"><span class="mark">i</span><h3>Schedules run only while Wasify AI is open and this computer is awake</h3>
  <p>A time that passes while the app is closed or the computer sleeps is written down as missed. A schedule can ask to run once when the app is back.</p>
  <div class="row top" style="grid-column:2;margin-top:4px"><button class="switch" role="switch" aria-checked="true" aria-label="Open Wasify AI when I log in" style="margin-top:2px"></button><span class="sm grow">Open Wasify AI when I log in, and keep it in the menu bar</span></div></div>`;
const OUT = {
  passed: ['t-ok', 'circle-check', 'Passed'], failed: ['t-bad', 'circle-x', 'Failed'], notchecked: ['t-quiet', 'circle-dashed', 'Not checked'], couldnot: ['t-warn', 'circle-alert', 'Could not check'],
  missed: ['t-quiet', 'clock', 'Missed'], skipped: ['t-quiet', 'circle-slash', 'Skipped: still running'], stopped: ['t-quiet', 'square', 'Stopped'], running: ['t-info', 'loader', 'Running now'],
};
const outcome = (k) => { const [tone, icon, word] = OUT[k]; return `<span class="badge ${tone}">${ic(icon, k === 'running' ? 'spin' : '')}${word}</span>`; };
const schedRow = (o) => `<div class="listrow" style="align-items:start"><div class="stack g4">
    <h3 style="${o.off ? 'color:var(--muted)' : ''}">${o.what}</h3>
    <div class="meta"><span>${ic('folder', 's14')}${o.project}</span><span>${ic('calendar-clock', 's14')}${o.rule}</span></div>
    <p class="muted" style="font-size:.8125rem">${o.next}</p>
    <div class="meta">${o.last}</div></div>
  <div class="acts"><button class="switch" role="switch" aria-checked="${!o.off}" aria-label="On"></button>
    ${o.running ? `<button class="btn outline sm">${ic('square', 's12')} Stop</button>` : `<button class="btn outline sm" ${o.off ? '' : ''}>${ic('play', 's12')} Run now</button>`}
    <button class="btn ghost sm" data-go="schedule-history">History</button><button class="tool" aria-label="Change or delete">${ic('more')}</button></div></div>`;

add({ id: 'scheduled', g: G6, name: 'The list of schedules', menu: true,
  note: 'Each schedule: what it asks, the project, its rule in words, the next time, and what happened last. The note that the app must be open and the computer awake is at the top and beside every next time. Run now is on each row.',
  render: () => shell({ current: 'code.scheduled', jobs: 1, body: `<div class="pagepad">
    <div class="pagehead"><div><h1>Scheduled</h1><p>Work the agent does by itself at times you set. It works on a copy of the project, and you look at the result before anything is applied.</p></div>
      <button class="btn" data-go="schedule-new">${ic('plus')} New schedule</button></div>
    ${awake()}
    <div class="stack">
      ${schedRow({ what: 'Update the packages and run the tests', project: 'bakery-site', rule: 'Every day at 02:00, London time',
        next: '<span class="strong" style="color:var(--text)">Next: tonight at 02:00</span>, if the app is open and the computer is awake',
        last: `${outcome('passed')}<span>today 02:00 · 3 files changed, waiting for you</span><button class="btn link" style="font-size:.8125rem" data-go="schedule-history">Look at the changes</button>` })}
      ${schedRow({ what: 'Check every link on the site', project: 'club-newsletter', rule: 'Monday, Wednesday and Friday at 09:00, London time', running: true,
        next: '<span class="strong" style="color:var(--text)">Next: Monday at 09:00</span>, if the app is open and the computer is awake',
        last: `${outcome('running')}<span>started by “Run now” at 14:03 · 3 min</span>` })}
      ${schedRow({ what: 'Write a summary of what changed this month', project: 'recipe-cards', rule: 'Every month on day 1 at 08:00, London time',
        next: '<span class="strong" style="color:var(--text)">Next: 1 December at 08:00</span>, if the app is open and the computer is awake',
        last: `${outcome('missed')}<span>1 November 08:00 · the app was closed</span>` })}
      ${schedRow({ what: 'Tidy the old drafts folder', project: 'club-newsletter', rule: 'Once, on 20 November 2026 at 18:00, London time', off: true,
        next: 'Off. It will not run.', last: '<span>Has not run yet</span>' })}
    </div></div>` }) });

const days = (on) => `<div class="row wrap" role="group" aria-label="Weekdays">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((d, i) => `<button class="chip" aria-pressed="${on.includes(i)}" style="padding:.25rem .6rem;font-size:.8125rem">${d}</button>`).join('')}</div>`;
const timeBox = (t) => `<div class="input tnum" style="width:5.5rem" aria-label="Time">${ic('clock', 's14 muted')}${t}</div>`;
const KINDS = [
  ['once', 'Once', 'On one day, at one time.', `<div class="row wrap"><div class="input" style="width:11.5rem" aria-label="Date">${ic('calendar-clock', 's14 muted')}20 November 2026</div><span class="sm muted">at</span>${timeBox('18:00')}</div>`],
  ['every', 'Every so many minutes or hours', 'Counted from when the schedule is saved.', `<div class="row wrap"><span class="sm muted">Every</span><div class="input tnum" style="width:4rem" aria-label="How many">30</div><div class="select" style="width:8rem"><span class="v">minutes</span>${ic('chevron-down', 's14')}</div></div><p class="xs muted" style="margin-top:6px">Five minutes at the least. Choose minutes or hours.</p>`],
  ['daily', 'Every day', 'At the same time each day.', `<div class="row wrap"><span class="sm muted">At</span>${timeBox('02:00')}</div>`],
  ['weekdays', 'On chosen weekdays', 'The days you pick, at one time.', `<div class="stack">${days([0, 1, 2, 3, 4])}<div class="row wrap"><span class="sm muted">At</span>${timeBox('09:00')}</div></div>`],
  ['monthly', 'Every month', 'On one day of the month, at one time.', `<div class="row wrap"><span class="sm muted">On day</span><div class="select tnum" style="width:5rem"><span class="v">31</span>${ic('chevron-down', 's14')}</div><span class="sm muted">at</span>${timeBox('08:00')}</div><p class="xs muted" style="margin-top:6px">In a month without a day 31 it runs on the month’s last day.</p>`],
];
const kindRadios = (open) => `<div class="radios" role="radiogroup" aria-label="When">${KINDS.map(([k, l, d, f]) =>
  `<div class="radio" role="radio" aria-checked="${k === open}" tabindex="0"><span class="o"></span><b>${l}</b><span class="d">${d}</span>${k === open ? `<div class="more">${f}</div>` : ''}</div>`).join('')}</div>`;

add({ id: 'schedule-new', g: G6, name: 'Making a schedule', menu: true,
  note: 'What to do in plain words (or from a template), then when: five plain kinds of rule, never cron text. A time zone, “run when missed”, and one sentence that says back what was set and when it will next run.',
  render: () => shell({ current: 'code.scheduled', body: `<div class="pagepad narrow">
    <div class="pagehead"><div><button class="btn link sm" data-go="scheduled">${ic('arrow-left', 's14')} Scheduled</button><h1>New schedule</h1></div></div>
    <div class="card stack g16">
      <div class="field"><span class="lab">Project</span><div class="select"><span class="v row">${ic('folder', 's14 muted')} bakery-site</span>${ic('chevron-down', 's14')}</div></div>
      <div class="field"><span class="lab">What should be done</span>
        <div class="area">Update the packages to their newest versions and run the tests. If a test fails, fix it or put that package back.</div>
        <div class="row wrap"><span class="hint">Or start from a template:</span><button class="chip round" style="padding:3px 10px">Update the packages</button><button class="chip round" style="padding:3px 10px">Fix failing tests</button><button class="chip round" style="padding:3px 10px">Summary of the week</button></div></div>
      <div class="field"><span class="lab">When</span>${kindRadios('weekdays')}</div>
      <div class="field"><span class="lab">Time zone</span><div class="select"><span class="v">Europe/London · this computer’s time zone</span>${ic('chevron-down', 's14')}</div>
        <span class="hint">Times are clock times in this zone, also when the clocks change.</span></div>
      <label class="row top sm"><span class="check" role="checkbox" aria-checked="true">${ic('check')}</span><span><span class="strong">Run when missed</span><br><span class="muted">If the app was closed or the computer asleep at the time, run once when it is back, as long as less than a day has passed. Otherwise the time is written down as missed.</span></span></label>
      <div class="notice slim t-ok"><span class="mark">✓</span><h3>Runs Monday to Friday at 09:00, London time</h3><p>Next: Monday 16 November at 09:00, if Wasify AI is open and this computer is awake.</p></div>
      <details class="experts" open><summary>${ic('chevron-right', 's14')} How a scheduled run works</summary>
        <ul class="rules t-quiet" style="margin-top:8px">${li('info', 'It works on a copy of the project. Your files change only when you look at the result and apply it.')}${li('info', 'Nobody is there to answer, so anything that would ask you is refused and written down.')}${li('info', 'It ends with the same check as a chat: passed, failed, not checked or could not check.')}${li('info', 'One run at a time: if the last run is still going when the next time comes, that time is skipped.')}</ul></details>
      <div class="row wrap"><button class="btn" data-go="scheduled">Save the schedule</button><button class="btn outline" data-go="scheduled">Cancel</button></div>
    </div></div>` }) });

add({ id: 'schedule-rules', g: G6, name: 'The five kinds of rule', menu: true,
  note: 'Not a real screen: the “When” part with each kind chosen in turn, to show the fields each one has. Once; every so many minutes or hours; every day; chosen weekdays; every month.',
  render: () => shell({ current: 'code.scheduled', body: `<div class="pagepad"><div class="two" style="align-items:start;gap:16px 20px">
    ${KINDS.map(([k, l, , f]) => `<div><div class="gal"><div><div class="lbl">${l}</div><div class="card flat stack"><div class="row"><span class="radio" style="padding:0;border:0;display:flex" aria-checked="true"><span class="o" style="margin:0"></span></span><b class="sm">${l}</b></div>${f}</div></div></div></div>`).join('')}
    <div><div class="lbl" style="font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px">When the clocks change</div>
      <p class="galnote">A time that does not exist on the day the clocks go forward runs at the first moment after the gap. A time that comes twice when they go back runs the first time only. The screen says this under “Time zone” on those two days of the year.</p></div>
  </div></div>` }) });

const hrow = (when, k, took, what, extra = '') => `<tr><td class="nowrap">${when}</td><td>${outcome(k)}${extra}</td><td class="opt tnum nowrap">${took}</td><td class="sm">${what}</td></tr>`;
add({ id: 'schedule-history', g: G6, name: 'A schedule’s history, and Run now', menu: true,
  note: 'Every time the schedule came due, with what happened: the four check words, and missed, skipped: still running, stopped. A run’s changes wait in its copy until the person looks and applies them. What a run would have asked is listed as refused.',
  render: () => shell({ current: 'code.scheduled', body: `<div class="pagepad">
    <div class="pagehead"><div class="stack g4"><button class="btn link sm" data-go="scheduled" style="justify-self:start">${ic('arrow-left', 's14')} Scheduled</button><h1>Update the packages and run the tests</h1>
        <p>${ic('folder', 's14')} bakery-site · Every day at 02:00, London time · Run when missed: on</p>
        <p><span class="strong" style="color:var(--text)">Next: tonight at 02:00</span>, if the app is open and the computer is awake</p></div>
      <div class="row wrap"><button class="switch" role="switch" aria-checked="true" aria-label="On"></button><button class="btn outline sm">Change</button><button class="btn sm">${ic('play', 's12')} Run now</button></div></div>
    <section class="tcard t-ok" style="max-width:none" aria-label="The last run's changes"><div class="head">${ic('circle-check')}<span class="word">Today’s run changed 3 files, in its copy</span></div>
      <p class="muted">Your project has not been touched. Look at the changes, then apply them or throw them away.</p>
      <p class="row top" style="font-size:.8125rem">${ic('hand', 's14 tone t-warn')}<span>It would have asked you once: <code>rm -rf dist/</code>. That was refused, because nobody was there to answer.</span></p>
      <div class="btns"><button class="btn sm" data-go="changes">Look at the changes</button><button class="btn outline sm">Apply to the project</button><button class="btn ghost sm">Throw away</button></div></section>
    <div class="card" style="padding:4px 6px"><table class="t"><thead><tr><th>It was due</th><th>What happened</th><th class="opt">Took</th><th>More</th></tr></thead><tbody>
      ${hrow('Today 02:00', 'passed', '4 min', '3 files changed, waiting for you')}
      ${hrow('Fri 13 Nov 02:00', 'failed', '11 min', 'The check still failed after 3 rounds. 2 files changed, thrown away by you')}
      ${hrow('Thu 12 Nov 02:00', 'skipped', '', 'The run from Wednesday night was still going')}
      ${hrow('Wed 11 Nov 02:00', 'stopped', '26 h', 'You stopped it on Thursday at 04:10')}
      ${hrow('Tue 10 Nov 02:00', 'missed', '', 'The app was closed until Wednesday')}
      ${hrow('Mon 9 Nov 02:00', 'notchecked', '6 min', 'Ran at 08:14, when the app was opened. It reached its limit of steps')}
      ${hrow('Sun 8 Nov 02:00', 'couldnot', '1 min', 'The check command was not found')}
      ${hrow('Sat 7 Nov 16:40', 'passed', '2 min', 'Started with Run now. Nothing needed changing')}
    </tbody></table></div></div>` }) });

/* ================================================================== 7 · Extensions */
const G7 = '7 · Extensions';
const EXT = [

  </div>` });
add({ id: 'extensions', g: G7, name: 'The short list', menu: true,
  note: 'A short list, not the whole catalogue: a few of Wasify AI’s own, a few public ones, and what the person added. Each is on or off for the project chosen at the top. A plugin that brings more than text has “Look and switch on” in place of the switch. The names are stand-ins; the list is the owner’s to choose.',
  render: () => extPage() });

const SKILL_TEXT = `---
name: code-review
description: Review the changes of a turn and list what could go wrong.
triggers: review, check my changes, what could go wrong
---

# Code review

When you are asked to review changes:

1. Read every changed file in full, not only the changed lines.
2. List what could go wrong, the worst first. Say where, and why.
3. Say plainly when you found nothing.
4. Do not change any file during a review unless you are asked to.`;
const extDetail = (over = '', plugin = false) => shell({ current: 'code.extensions', over, body: `<div class="pagepad">
    <div class="pagehead"><div class="stack g4"><button class="btn link sm" data-go="extensions" style="justify-self:start">${ic('arrow-left', 's14')} Extensions</button>
        <h1 class="row wrap">${plugin ? 'Release notes' : 'Code review'} <span class="badge ${plugin ? 'tag' : 'fill'}">${plugin ? 'Plugin' : 'Skill'}</span></h1>
        <p>${plugin ? 'Writes the notes for a new version from the changes since the last one.' : 'Reads the changes of a turn and lists what could go wrong, the worst first.'}</p>
        <p class="sm">From the OpenHands catalogue · version 0.42.0 · already on this computer</p></div>
      <div class="stack g4 sideacts"><button class="btn" ${plugin ? 'data-go="extension-approve"' : ''}>${plugin ? 'Look and switch on' : 'Switch on for bakery-site'}</button><span class="xs muted">Off for bakery-site</span></div></div>
    <div class="field"><span class="lab">When the agent uses it</span><p class="sm">When your message is about a review, for example “review this”, “check my changes” or “what could go wrong”.</p></div>
    <div class="field"><span class="lab">The text it gives the agent</span>

      <div class="card flat" style="padding:0"><div class="out" style="max-height:200px;white-space:pre-wrap" tabindex="0">${esc(SKILL_TEXT)}</div><div class="outfoot"><span>SKILL.md · 14 lines · shown as plain text</span></div></div></div>
    <div class="field"><span class="lab">Where it is on</span>
      <div class="stack g4">
        <div class="row between sm"><span class="row">${ic('folder', 's14 muted')} bakery-site</span><button class="switch" role="switch" aria-checked="false" aria-label="On for bakery-site"></button></div>
        <div class="row between sm"><span class="row">${ic('folder', 's14 muted')} club-newsletter</span><button class="switch" role="switch" aria-checked="true" aria-label="On for club-newsletter"></button></div>
        <div class="row between sm"><span class="row">${ic('folder', 's14 muted')} recipe-cards</span><button class="switch" role="switch" aria-checked="false" aria-label="On for recipe-cards"></button></div>
      </div></div>
  </div>` });
add({ id: 'extension-detail', g: G7, name: 'An entry’s details, with its text', menu: true,

add({ id: 'extension-add', g: G7, name: 'Adding one from a folder', menu: true,

    <div class="notice slim t-ok"><span class="mark">✓</span><h3>Found a skill: “House style”</h3><p><code>SKILL.md</code>, 1.2 KB. It brings text only: no hook and no tool connection.</p></div>

add({ id: 'extension-approve', g: G7, name: 'Approving a plugin that brings more than text', menu: true,
  note: 'A plugin with a hook or a tool connection is approved once, with everything it brings listed in plain words. Until then it stays off. A hook must finish within a second.',

    <h2>Allow “Release notes” to bring more than text?</h2>

      <li class="row top">${ic('sparkles', 'muted')}<span><span class="strong">2 skills</span> · “Write release notes” and “Version numbers”<br><span class="muted">Text, shown on the plugin’s page.</span></span></li>
      <li class="row top">${ic('wrench', 'tone t-warn')}<span><span class="strong">1 hook</span> · runs <code>check-version.sh</code> before each command of the agent<br><span class="muted">It must finish within one second, or it is stopped.</span></span></li>
      <li class="row top">${ic('plug', 'tone t-warn')}<span><span class="strong">1 tool connection</span> · “changelog”<br><span class="muted">A small program on this computer that the agent can call to read and write <code>CHANGELOG.md</code>.</span></span></li>
    </ul>
    <p class="xs muted row top">${ic('lock', 's12')}<span>Both run under the agent’s limits: the project’s folder only, and no internet. You can take this back on the plugin’s page.</span></p>
