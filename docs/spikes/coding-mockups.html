  </div></div>`, true) });
</script>
<script>
/* ================================================================== 8 · Settings › Optional parts */
const G8 = '8 · Settings › Optional parts';
const meter = (title, pct) => `<div class="stack g4"><div class="row between sm"><span>${title}</span><span class="muted tnum">${pct}%</span></div><div class="progress"><i style="width:${pct}%"></i></div></div>`;
const part = (title, said, body = '', btns = '', hi = false) => `<li class="stack" style="border:1px solid ${hi ? 'color-mix(in oklch, var(--accent) 45%, var(--border))' : 'var(--border)'};border-radius:var(--radius-sm);padding:12px;background:var(--surface)">
    <div class="row between wrap"><span class="strong">${title}</span><span class="sm muted">${said}</span></div>${body}${btns ? `<div class="row wrap">${btns}</div>` : ''}</li>`;
const CODING_LINE = `<p class="sm muted">Lets an agent read, change and run code in a folder you choose. It runs in a protected area of this computer.</p>`;
const codingPart = (state) => ({
  none: part('Coding engine', 'Not set up · about 385 MB', CODING_LINE, `<button class="btn sm" data-go="settings-states">Set up</button>`, true),
  installing: part('Coding engine', 'Setting up', CODING_LINE + meter('Step 2 of 4: Fetching the engine', 46), `<button class="btn outline sm">Stop</button>`, true),
  installed: part('Coding engine', 'Set up · 1.62.0', CODING_LINE, `<button class="btn outline sm">Repair</button><button class="btn outline sm" data-go="settings-remove">Remove</button>`, true),
  repairing: part('Coding engine', 'Repairing', CODING_LINE + meter('Step 1 of 3: Checking every file against its checksum', 72), `<button class="btn outline sm">Stop</button>`, true),
  failed: part('Coding engine', '<span style="color:var(--danger)">Setting up stopped: the download was cut off</span>', CODING_LINE + `<p class="sm">212 MB of 385 MB arrived. Check the internet connection and try again; what arrived is kept.</p>`, `<button class="btn sm">Try again</button>`, true),
  unsupported: part('Coding engine', 'Not available on this computer yet', `<p class="sm muted">The coding engine works on a Mac for now. Windows and Linux come later.</p>`, '', true),
}[state]);
const settingsPage = (inner, over = '') => shell({ current: 'settings', title: 'Settings', over, body: `<div class="setgrid" style="max-width:64rem;margin:0 auto;padding:32px 32px 40px;display:grid;gap:32px;grid-template-columns:12rem minmax(0,1fr)">
    <aside><div class="stack g12"><div class="input">${ic('search', 's14 muted')}<span class="ph">Search settings</span></div>
      <nav class="stack g4" aria-label="Settings groups">${['General', 'Models', 'Your keys', 'Privacy and sharing', 'Other apps', 'Advanced'].map((g) => `<button class="mi" style="padding:6px 10px;font-size:.875rem;${g === 'Models' ? 'background:var(--accent-soft)' : ''}">${g}</button>`).join('')}</nav></div></aside>
    <div class="stack g16"><h2 style="font-size:1.125rem;font-weight:600;border-bottom:1px solid var(--border);padding-bottom:8px">Models</h2>
      <section class="stack"><h3 style="font-size:1rem;font-weight:600">Optional parts</h3>
        <p class="sm muted">Parts of the app that are added only when you use what needs them. Each is fetched once, checked against its pinned checksum, and kept on this computer.</p>
        ${inner}</section></div></div>` });
const otherParts = () => part('Image engine (ComfyUI)', 'Set up · 0.3.60 · on Metal', '', `<button class="btn outline sm">Repair</button><button class="btn outline sm">Remove</button>`) + part('Language engine (llama.cpp)', 'Not set up · about 96 MB', '', `<button class="btn sm">Set up</button>`);

add({ id: 'settings', g: G8, name: 'The Coding engine, not set up', menu: true,
  note: 'The coding engine is one more row in the list of optional parts that exists today, with the same words and buttons as the others: what it is, its size, Set up.',
  render: () => settingsPage(`<ul class="stack" aria-label="Optional parts">${otherParts()}${codingPart('none')}</ul>`) });

add({ id: 'settings-states', g: G8, name: 'Every state of the row', menu: true,
  note: 'Not a real screen: the same row in each state it can be in. Setting up shows the step and how far; a failure says what happened and what to do; a computer that cannot run it says so and offers no button.',
  render: () => settingsPage(`<div class="gal">${[['Not set up, with its size', 'none'], ['Setting up', 'installing'], ['Set up', 'installed'], ['Repairing', 'repairing'], ['Setting up failed', 'failed'], ['Not available on this computer yet', 'unsupported']]
    .map(([l, s]) => `<div><div class="lbl">${l}</div><ul>${codingPart(s)}</ul></div>`).join('')}</div>`) });

add({ id: 'settings-remove', g: G8, name: 'Removing it', menu: true,
  note: 'Remove asks first and says what stops and what is kept: the person’s projects, sessions and schedules are not touched.',
  render: () => settingsPage(`<ul class="stack" aria-label="Optional parts">${otherParts()}${codingPart('installed')}</ul>`,
    `<div class="scrim"><div class="dialog" role="alertdialog" aria-label="Remove Coding engine?"><h2>Remove Coding engine?</h2>
      <p class="sm muted">Code stops working until it is set up again, and schedules do not run. Your projects and their files, your sessions and your schedules are not touched.</p>
      <div class="acts"><button class="btn outline" data-go="settings">Cancel</button><button class="btn danger" data-go="settings">Remove</button></div></div></div>`) });

/* ================================================================== 9 · States that are easy to forget */
const G9 = '9 · States that are easy to forget';
add({ id: 'no-engine', g: G9, name: 'Code opened, engine not set up', menu: true,
  note: 'Opening Code without its engine shows one card: what the part is, where it comes from, its size and one button. Nothing is fetched before the click, and the work goes on in the tray if the person leaves.',
  render: () => shell({ current: 'code.projects', body: `<div class="pagepad narrow">
    <div class="pagehead"><div><h1>Code needs one more part</h1><p>Wasify AI can read, change and run code with an agent. The part that does it is added only when you want it.</p></div></div>
    <div class="card stack g12">
      <div class="row top">${ic('code', 's24 muted')}<div class="grow"><div class="strong">Coding engine</div>
        <div class="sm muted">The OpenHands agent engine, from the project’s published packages. Fetched once, checked against its pinned checksum, and kept on this computer.</div></div></div>
      <dl class="stack g4 sm"><div class="row"><dt class="muted" style="width:8rem;flex:none">Size</dt><dd>about 385 MB</dd></div>
        <div class="row"><dt class="muted" style="width:8rem;flex:none">While it runs</dt><dd>340 to 510 MB of memory</dd></div>
        <div class="row"><dt class="muted" style="width:8rem;flex:none">Works on</dt><dd>a Mac, for now</dd></div></dl>
      <div class="row wrap"><button class="btn" data-go="settings-states">${ic('download')} Set up · 385 MB</button><button class="btn outline">Not now</button></div>
      <p class="xs muted">You can remove it at any time in Settings › Optional parts.</p>
    </div>
    ${rulesCards()}
  </div>` }) });

add({ id: 'engine-starting', g: G9, name: 'The engine is starting', menu: false,
  note: 'The engine starts when a project is opened and takes a few seconds. The session is already laid out; the box says why it waits.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'New session' }), right: sessRight('starting', '$0.00'),
    body: session({ tab: 'files',
      panel: `<div class="panehead"><div class="skel" style="width:180px;height:14px"></div></div><div class="stack g12" style="padding:16px">${[70, 45, 60, 38, 52, 66, 30].map((w) => `<div class="skel" style="width:${w}%"></div>`).join('')}</div>`,
      thread: thread(`<div class="hello">${ic('loader', 's24 spin tone t-info')}<h2>Starting the coding engine…</h2><p class="muted sm" style="max-width:36ch">This takes 5 to 9 seconds. It starts when you open a project and stops when you quit Wasify AI.</p></div>`, 'center'),
      composer: { off: true, tall: true, note: 'You can write as soon as it is ready.' } }) }) });

add({ id: 'error', g: G9, name: 'An error in a session', menu: false,
  note: 'When the engine stops in the middle of a turn: what happened in plain words, what is true about the files, and what to do. The raw text is under “Details for experts”. The turn counts as not checked.',
  render: () => shell({ current: 'code.projects', slot: sessSlot(), right: sessRight('notchecked', '$0.09'),
    body: session({ tab: 'changes', n: 2, pane: { count: 2 },
      thread: thread(ASK + ai(LOOKED, PLAN_P, steps(edit('Changed', 'src/pages/home.html', 13, 2), edit('Added', 'src/hours.js', 22, 0)))
        + `<div class="notice slim t-bad" role="alert"><span class="mark">!</span><h3>The coding engine stopped</h3>
            <p>It stopped while the agent was working. The 2 files it had changed are still changed, and the check did not run. Start the engine again to go on, or undo the turn.</p>
            <div class="acts"><button class="btn sm">Start it again</button><button class="btn outline sm" data-go="changes-undone">${ic('undo', 's14')} Undo this turn</button></div>
            <details class="experts" style="grid-column:2;margin-top:6px"><summary>${ic('chevron-right', 's14')} Details for experts</summary><div class="out" style="padding:6px 0 0">agent-server exited with status 137 after 41 s
logs: Wasify AI data folder › logs › coding-engine.log</div></details></div>`, 'toend'),
      composer: { off: true, note: 'The coding engine is not running.' } }) }) });

add({ id: 'error-folder', g: G9, name: 'A project’s folder is gone', menu: true,
  note: 'A folder that was moved, renamed or deleted outside the app: the project stays in the list with its sessions, says what is wrong, and offers the two things that can be done.',
  render: () => shell({ current: 'code.projects', body: `<div class="pagepad">
    <div class="pagehead"><div><h1>Projects</h1><p>The folders the agent works in. Each keeps its own sessions, check and extensions.</p></div>
      <button class="btn">${ic('folder-open')} Choose a folder</button></div>
    <div class="stack">
      <div class="notice t-warn" role="status"><span class="mark">!</span><h3>The folder of bakery-site is not where it was</h3>
        <p>Wasify AI looked in <code>~/Projects/bakery-site</code>. It may have been moved, renamed or deleted. Its 3 sessions are kept, and its schedules are paused.</p>
        <div class="acts"><button class="btn sm">Show where it is now</button><button class="btn outline sm">Remove from the list</button></div></div>
      ${projRow({ name: 'club-newsletter', path: '~/Documents/club-newsletter', sessions: '7 sessions', tone: 't-ok', icon: 'circle-check', word: 'Check passed', last: 'Fix the sign-up form · today 09:15' })}
    </div></div>` }) });

add({ id: 'empty-scheduled', g: G9, name: 'An empty list: Scheduled', menu: true,
  note: 'A list with nothing in it says what goes there and gives the first step. The note about the app being open is already there.',
  render: () => shell({ current: 'code.scheduled', body: `<div class="pagepad">
    <div class="pagehead"><div><h1>Scheduled</h1><p>Work the agent does by itself at times you set.</p></div></div>
    ${awake()}
    <div class="card"><div class="empty"><span class="round">${ic('calendar-clock', 's24')}</span><h3>No schedules yet</h3>
      <p>A schedule asks the agent to do something by itself: every night, on chosen weekdays, or once. It works on a copy of the project, and you look at the result before anything is applied.</p>
      <div style="margin-top:8px"><button class="btn" data-go="schedule-new">${ic('plus')} New schedule</button></div></div></div>
  </div>` }) });

add({ id: 'empty-changes', g: G9, name: 'An empty list: Changes', menu: false,
  note: 'Before the agent has changed anything, the Changes tab says what will appear there.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'New session' }), right: sessRight('none', '$0.01'),
    body: session({ tab: 'changes', small: 'changes', pane: { empty: true },
      thread: thread(user('What does site.js do?') + ai(steps(read('src/site.js')), p('It opens and closes the menu on small screens, and nothing else.'), under()), ''),
      composer: {} }) }) });

const LONG = Array.from({ length: 30 }, (_, i) => `<span class="dim">${String(4783 + i).padStart(5, ' ')}</span>  dist/assets/photo-${String(118 + i).padStart(3, '0')}.webp  ${(38 + (i * 7) % 61)}.${i % 10} kB`).join('\n')
  + `\n<span class="dim"> 4813</span>  <span class="g">✓ built in 1 min 11 s</span>`;
add({ id: 'long-output', g: G9, name: 'A very long output', menu: false,
  note: 'A command that printed thousands of lines stays one quiet line in the chat. Opened, it shows only the end, in a box that scrolls by itself. “See all of it” opens the whole output beside the chat, loaded a part at a time, and it can be saved as a file.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'Build for the web' }), right: sessRight('passed', '$0.17'),
    body: session({ tab: 'terminal', small: 'chat',
      panel: `<div class="panehead"><span class="strong sm">Output of</span><code>npm run build</code><span class="xs muted">4,813 lines · 1 min 12 s · no errors</span>
          <span class="end row"><button class="btn ghost xs">${ic('search', 's12')} Find</button><button class="btn ghost xs">${ic('download', 's12')} Save as a file</button><button class="tool" aria-label="Close" data-go="terminal">${ic('x')}</button></span></div>
        <div style="padding:8px 12px 0"><button class="btn outline xs">${ic('arrow-up', 's12')} Load the 4,782 lines before these</button></div>
        <div class="term" tabindex="0" style="white-space:pre;overflow:auto">${LONG}</div>`,
      thread: thread(user('Install what the project needs and build it.') + ai(
        steps(cmd('npm install', '· 48 s · no errors', '', false)),
        cmd('npm run build', '· 1 min 12 s · no errors', LONG, true, `<span>The last 31 of 4,813 lines</span><button class="btn link" style="font-size:.75rem">See all of it</button><button class="btn link" style="font-size:.75rem">Save as a file</button>`),
        p('The site is built: 148 pictures and 12 pages are in <code>dist/</code>.'), PASSCARD(), under()), 'toend'),
      composer: {} }) }) });

add({ id: 'stopped', g: G9, name: 'Stopped by the person', menu: false,
  note: 'Stop ends the turn (and a running check) at once. The chat says who stopped it, what had already changed, and that nothing was checked; the bar says “Not checked”. The person can run the check, undo the turn, or say what to do next.',
  render: () => shell({ current: 'code.projects', slot: sessSlot(), right: sessRight('notchecked', '$0.09'),
    body: session({ tab: 'changes', n: 2, pane: { count: 2 },
      thread: thread(ASK + ai(LOOKED, PLAN_P, steps(edit('Changed', 'src/pages/home.html', 13, 2), edit('Added', 'src/hours.js', 22, 0)))
        + marker('You stopped this turn · 14:06')
        + checkCard('notchecked', { line: 'The agent had changed 2 files when you stopped it. They are kept as they are, and the check did not run.',
          btns: `<button class="btn outline sm" data-go="check-running">${ic('play', 's12')} Run the check now</button><button class="btn outline sm" data-go="changes-undone">${ic('undo', 's14')} Undo this turn</button><button class="btn ghost sm" data-go="changes">See the changes</button>` }), 'toend'),
      composer: { placeholder: 'Say what to do next' } }) }) });

add({ id: 'cost-limit', g: G9, name: 'The session reached its cost limit', menu: false,
  note: 'The engine counts and limits what a session costs. At the limit the turn stops and asks; nothing is lost, and the turn counts as not checked until it goes on.',
  render: () => shell({ current: 'code.projects', slot: sessSlot({ name: 'Move every page to the new layout' }), right: sessRight('notchecked', '$2.00'),
    body: session({ tab: 'changes', n: 9,
      thread: thread(marker('Turn 6') + ai(steps(edit('Changed', 'src/pages/bread.html', 41, 37), edit('Changed', 'src/pages/about.html', 28, 30)))
        + `<div class="notice slim t-warn" role="status"><span class="mark">!</span><h3>This session reached its limit of $2.00</h3>
            <p>The agent stopped in the middle of a turn. The files it changed are kept, and the check has not run. Raise the limit to let it go on.</p>
            <div class="acts"><button class="btn sm">Raise the limit to $4.00 and go on</button><button class="btn outline sm">Stop here</button></div></div>`, 'toend'),
      composer: { off: true, note: 'Waiting for your choice above.' } }) }) });
</script>

<script>
/* ================================================================== the page around the window */
const q = new URLSearchParams(location.search);
const S = {
  id: q.get('s') || location.hash.slice(1) || SCREENS[0].id,
  theme: q.get('theme') === 'dark' ? 'dark' : 'light',
  size: q.get('size') === 'small' ? 'small' : 'usual',
  all: q.get('all') === '1' || location.hash === '#all',
  menu: null, // null: as the screen says; true or false once the person pressed the bar's button
};
if (q.get('bare') === '1') document.body.classList.add('bare');
if (!SCREENS.some((s) => s.id === S.id)) S.id = SCREENS[0].id;
const byId = (id) => SCREENS.find((s) => s.id === id);

function winHTML(s) {
  const open = S.menu ?? s.menu;
  return `<div class="win" data-theme="${S.theme}" data-size="${S.size}" data-menu="${open ? 'open' : 'closed'}" data-screen="${s.id}">${s.render()}</div>`;
}
function settle(root) {
  root.querySelectorAll('.thread.toend').forEach((t) => { t.scrollTop = t.scrollHeight; });
  root.querySelectorAll('.term, .tcard .out, .thread .stepbody .out').forEach((t) => { t.scrollTop = t.scrollHeight; });
  root.querySelectorAll('.side .items').forEach((m) => { const c = m.querySelector('[aria-current=page]'); if (c && c.offsetTop + c.offsetHeight > m.clientHeight) m.scrollTop = c.offsetTop + c.offsetHeight - m.clientHeight + 6; });
  root.querySelectorAll('[data-act=theme] use').forEach((u) => u.setAttribute('href', S.theme === 'dark' ? '#i-sun' : '#i-moon'));
}
function render() {
  const stage = document.getElementById('stage');
  if (S.all) {
    stage.innerHTML = `<div class="allgrid">${SCREENS.map((s) => `<section id="all-${s.id}"><div class="cap"><h2>${s.g} › ${s.name}</h2><p>${s.note}</p></div><div class="frame">${winHTML(s)}</div></section>`).join('')}</div>`;
  } else {
    const s = byId(S.id);
    stage.innerHTML = `<div class="cap"><h2>${s.g} › ${s.name}</h2><p>${s.note}</p></div><div class="frame">${winHTML(s)}</div>`;
  }
  settle(stage);
  const groups = [...new Set(SCREENS.map((s) => s.g))];
  document.getElementById('rail').innerHTML = `<h1>Code in Wasify AI</h1><p class="sub">Mockups of every screen. Nothing here is built. ${SCREENS.length} screens.</p>` + groups.map((g) =>
    `<h2>${g}</h2>` + SCREENS.filter((s) => s.g === g).map((s) => `<button data-screen="${s.id}" aria-current="${!S.all && s.id === S.id}">${s.name}</button>`).join('')).join('');
  document.querySelectorAll('#themeseg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.theme === S.theme));
  document.querySelectorAll('#sizeseg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.size === S.size));
  document.getElementById('allbtn').textContent = S.all ? 'One screen at a time' : 'All screens on one page';
  const i = SCREENS.findIndex((s) => s.id === S.id);
  document.getElementById('where').textContent = S.all ? `${SCREENS.length} screens` : `Screen ${i + 1} of ${SCREENS.length} · ← → move between screens`;
  if (!document.body.classList.contains('bare')) history.replaceState(null, '', S.all ? '#all' : `#${S.id}`);
  document.querySelector('.rail [aria-current=true]')?.scrollIntoView({ block: 'nearest' });
}
function go(id) { if (!byId(id)) return; S.id = id; S.all = false; S.menu = null; render(); window.scrollTo(0, 0); }
function move(d) { const i = SCREENS.findIndex((s) => s.id === S.id); go(SCREENS[(i + d + SCREENS.length) % SCREENS.length].id); }

document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-act], [data-go], [role=switch], [role=checkbox], [role=radio]');
  if (!t) return;
  if (t.dataset.screen) return go(t.dataset.screen);
  if (t.closest('#themeseg')) { S.theme = t.dataset.theme; return render(); }
  if (t.closest('#sizeseg')) { S.size = t.dataset.size; return render(); }
  if (t.id === 'prev') return move(-1);
  if (t.id === 'next') return move(1);
  if (t.id === 'allbtn') { S.all = !S.all; return render(); }
  const win = t.closest('.win');
  if (!win) return;
  if (t.dataset.act === 'menu') { S.menu = win.dataset.menu !== 'open'; if (S.all) { win.dataset.menu = S.menu ? 'open' : 'closed'; S.menu = null; return; } return render(); }
  if (t.dataset.act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; return render(); }
  if (t.dataset.act === 'check') return go('check-setup');
  if (t.dataset.act === 'cost') return go('session-cost');
  if (t.dataset.go) return go(t.dataset.go);
  if (t.getAttribute('role') === 'switch' || t.getAttribute('role') === 'checkbox') { const on = t.getAttribute('aria-checked') !== 'true'; t.setAttribute('aria-checked', on); if (t.classList.contains('check')) t.innerHTML = on ? ic('check') : ''; return; }
  if (t.closest('.seg, [role=group]') && t.hasAttribute('aria-pressed') && t.classList.contains('chip')) { t.setAttribute('aria-pressed', t.getAttribute('aria-pressed') !== 'true'); return; }
  if (t.closest('.seg')) { t.closest('.seg').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === t)); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea') || e.metaKey || e.ctrlKey || e.altKey || S.all) return;
  if (e.key === 'ArrowRight') move(1);
  if (e.key === 'ArrowLeft') move(-1);
});
addEventListener('hashchange', () => { const id = location.hash.slice(1); if (id === 'all') { S.all = true; render(); } else if (byId(id) && id !== S.id) go(id); });
render();
</script>
</body>
</html>
