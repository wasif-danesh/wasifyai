[project]
name = "wasifyai-platform-sdk"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "cryptography>=43",
    "fastapi>=0.142.2",
    "imageio-ffmpeg>=0.5",
    "langgraph>=1.2.14",
    "obstore>=0.11.1",
    "openai>=3.26.0",
    "pillow>=10",
    "pydantic>=2.9",
    "pyyaml>=6",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "wasifyai-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasifyai_platform_sdk"]

[tool.uv.sources]
wasifyai-contracts = { workspace = true }
