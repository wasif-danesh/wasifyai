# The platform's sample product: proves the stack end to end. Its graph lives in
# services/api/src/wasifyai_api/graphs/hello.py.
id: hello
capabilities:
  text.chat: { provider: litellm, model: default-chat }
  # Accepts image and audio parts; the graph uses it when the run input names a stored file.
  text.multimodal: { provider: litellm, model: multimodal, inputs: [text, image, audio] }
