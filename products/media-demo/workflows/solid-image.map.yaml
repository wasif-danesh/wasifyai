workflow: solid-image.json
notes: >
  Used by the kind overlay (PRODUCT_ENV=kind) to prove that the ComfyUI container starts, that the worker reaches it
  and gets a file back, on a machine with no GPU and no models. The prompt, seed and steps are accepted and ignored.
inputs:
  prompt: { node: "3", field: value }
  seed: { node: "4", field: value }
  steps: { node: "5", field: value }
  width: { node: "1", field: width }
  height: { node: "1", field: height }
outputs:
  image: { node: "2", type: image }
