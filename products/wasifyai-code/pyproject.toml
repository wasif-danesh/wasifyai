[project]
name = "wasifyai-code"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["wasifyai-platform-sdk", "langgraph>=0.6", "pydantic>=2.9", "httpx>=0.27", "websockets>=13"]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-code = "wasifyai_code:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_code"]
