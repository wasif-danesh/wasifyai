[project]
name = "wasifyai-code"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["wasifyai-platform-sdk"]

# No "wasifyai.products" entry point yet, on purpose: the engine finds a product by that entry point,
# and this package is library code that is not wired into the app (docs/spikes/coding-cores.md).
# The entry point arrives with the actions and routes of stage C1b.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_code"]
