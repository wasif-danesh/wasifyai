id: wasifyai-image
capabilities:
  text.enhance:        { provider: litellm, model: prompt-enhancer }
  text.describe_image: { provider: litellm, model: multimodal, inputs: [text, image] }
  image.generate:      { provider: comfyui, workflow: flux2-klein-4b, defaults: { width: 1024, height: 1024 } }
  image.edit:          { provider: comfyui, workflow: flux2-klein-4b-edit }
  image.reference:     { provider: comfyui, workflow: flux2-klein-4b-reference, defaults: { width: 1024, height: 1024 } }
  image.inpaint:       { provider: comfyui, workflow: flux2-klein-4b-inpaint }
uploads:
  image: { max_bytes: 10485760 }
enhance:
  text_to_image: { prompt: enhance_text_to_image, max_chars: 500 }
  edit_image:    { prompt: enhance_edit_image, max_chars: 500, needs_picture: true }
