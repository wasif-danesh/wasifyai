id: wasifyai-image
capabilities:
  text.enhance:        { provider: litellm, model: prompt-enhancer }
  text.describe_image: { provider: litellm, model: multimodal, inputs: [text, image] }
# The models a person can choose in Images (ADR-0097), ids as in models.yaml; the first is used when a
# request names none. A model binds only what it can do. A model's `settings` may name a `prompt_writer`: a
# prompt in prompts/ the text model uses to turn the person's words into the caption that model reads.
models:
  - id: flux2-klein-4b
    capabilities:
      image.generate:  { provider: comfyui, workflow: flux2-klein-4b, defaults: { width: 1024, height: 1024 } }
      image.edit:      { provider: comfyui, workflow: flux2-klein-4b-edit }
      image.reference: { provider: comfyui, workflow: flux2-klein-4b-reference, defaults: { width: 1024, height: 1024 } }
      image.inpaint:   { provider: comfyui, workflow: flux2-klein-4b-inpaint }
  - id: qwen-image-2.1
    capabilities:
      image.generate:  { provider: comfyui, workflow: qwen-image-2.1, defaults: { width: 1024, height: 1024 } }
      image.edit:      { provider: comfyui, workflow: qwen-image-2.1-edit }
      image.reference: { provider: comfyui, workflow: qwen-image-2.1-reference, defaults: { width: 1024, height: 1024 } }
  - id: z-image-turbo
    capabilities:
      image.generate:  { provider: comfyui, workflow: z-image-turbo, defaults: { width: 1024, height: 1024 } }
  - id: hidream-o1
    capabilities:
      image.generate:  { provider: comfyui, workflow: hidream-o1, defaults: { width: 1024, height: 1024 } }
  - id: flux2-klein-9b
    capabilities:
      image.generate:  { provider: comfyui, workflow: flux2-klein-9b, defaults: { width: 1024, height: 1024 } }
      image.edit:      { provider: comfyui, workflow: flux2-klein-9b-edit }
      image.reference: { provider: comfyui, workflow: flux2-klein-9b-reference, defaults: { width: 1024, height: 1024 } }
      image.inpaint:   { provider: comfyui, workflow: flux2-klein-9b-inpaint }
  - id: flux3-image-klein
    capabilities:
      image.generate:  { provider: comfyui, workflow: flux3-image-klein, defaults: { width: 1024, height: 1024 } }
      image.edit:      { provider: comfyui, workflow: flux3-image-klein-edit }
  - id: ideogram-4
    settings: { prompt_writer: write_ideogram_caption }
    capabilities:
      image.generate:  { provider: comfyui, workflow: ideogram-4, defaults: { width: 1024, height: 1024 } }
uploads:
  image: { max_bytes: 10485760 }
enhance:
  text_to_image: { prompt: enhance_text_to_image, max_chars: 500 }
  edit_image:    { prompt: enhance_edit_image, max_chars: 500, needs_picture: true }
