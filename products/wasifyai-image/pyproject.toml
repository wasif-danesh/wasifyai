[project]
name = "wasifyai-image"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["wasifyai-platform-sdk", "langgraph>=0.6", "pydantic>=2.9", "sqlalchemy[asyncio]>=2.0", "pyyaml>=6", "pillow>=10"]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-image = "wasifyai_image:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_image"]

# The prompt templates are product files, not Python, but a wheel has to carry them.
[tool.hatch.build.targets.wheel.force-include]
"prompts" = "wasifyai_image/prompts"
