workflow: flux2-klein-4b.json
licence: "Apache-2.0 per the FLUX.2 [klein] 4B model card (ADR-0019). The 9B variant is licensed differently and is not used"
notes: >
  Text to image. The same workflow as the song covers, with a size: executed against
  ComfyUI 0.39, 1024x1024 in about 25 s. It matches the official ComfyUI template (4 steps, cfg 1).
  The VAE comes from the Comfy-Org/flux2-klein repo (Apache-2.0); the template points at the
  flux2-dev VAE, which carries a non-commercial label, so do not swap it in.
models:
  - diffusion_models/flux-2-klein-4b.safetensors
  - text_encoders/qwen_3_4b.safetensors
  - vae/flux2-vae.safetensors
inputs:
  prompt: { node: "4", field: text }
  seed: { node: "9", field: noise_seed }
  steps: { node: "7", field: steps }
  width:
    - { node: "6", field: width }
    - { node: "7", field: width }
  height:
    - { node: "6", field: height }
    - { node: "7", field: height }
outputs:
  image: { node: "13", type: image }
# LoRAs (ADR-0051): the diffusion model's output goes through up to three model-only LoRA loaders
# before the guider. A klein LoRA patches the diffusion model; the text encoder is not patched.
lora_chain:
  loader: LoraLoaderModelOnly
  max: 3
  from: { node: "1", output: 0 }
  to:
    - { node: "10", field: model }
