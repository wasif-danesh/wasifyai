workflow: flux2-klein-9b-reference.json
notes: >
  FLUX.2 klein 9B: the klein 4B workflow with the 9B model (bf16, black-forest-labs/FLUX.2-klein-9B; the
  template's fp8 file does not load on a Mac) and its Qwen3 8B text encoder (fp8mixed, Comfy-Org/flux2-klein-9B).
  Two reference pictures and a prompt make a new picture at a size the person chooses ("the cat from the
  first picture sitting on the chair from the second picture"). The Edit workflow's mechanism with a second
  reference: each picture is scaled to half a megapixel (in multiples of 16), encoded, and fed to the positive and
  negative conditioning as a reference latent, one after the other. Half a megapixel keeps both subjects
  recognisable and takes about 70 s instead of 100 to 120 s at a full megapixel (docs/spikes/image-ir0.md).
  The worker uploads the two pictures under per-job names and the API writes those names into the two LoadImage nodes.
models:
  - diffusion_models/flux-2-klein-9b.safetensors
  - text_encoders/qwen_3_8b_fp8mixed.safetensors
  - vae/flux2-vae.safetensors
inputs:
  prompt: { node: "4", field: text }
  seed: { node: "19", field: noise_seed }
  steps: { node: "10", field: steps }
  width:
    - { node: "9", field: width }
    - { node: "10", field: width }
  height:
    - { node: "9", field: height }
    - { node: "10", field: height }
  image: { node: "6", field: image }
  image2: { node: "13", field: image }
outputs:
  image: { node: "23", type: image }
# LoRAs (ADR-0051): the diffusion model's output goes through up to eight model-only LoRA loaders (ADR-0091)
# before the guider. A klein LoRA patches the diffusion model; the text encoder is not patched.
lora_chain:
  loader: LoraLoaderModelOnly
  max: 8
  from: { node: "1", output: 0 }
  to:
    - { node: "20", field: model }
