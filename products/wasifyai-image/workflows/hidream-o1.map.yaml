workflow: hidream-o1.json
notes: >
  Text to image with HiDream-O1 (bf16, one checkpoint holding the model, its text side and its decoder). ComfyUI's
  template image_hidream_o1 (ComfyUI 0.44.2) written out by hand with its switches off: no reference picture and no
  prompt rewriter (Gemma 4 E4B, not kept). Noise scale 8, seam smoothing for the last 20 percent with the average blend (the template's
  median aborts on Apple's graphics chip: torch.median over the stack, 2026-11-07), cfg 5, 40 steps
  in the template.
  The model computes in fp32 (ModelComputeDtype): in bf16 on Apple's graphics chip every picture came out as broken
  stripes (2026-11-07); fp32 fixed it: 20 steps at 1024 px in 192 s with the load on the owner's M5 Pro.
models:
  - checkpoints/hidream_o1_image_bf16.safetensors
inputs:
  prompt: { node: "6", field: text }
  seed: { node: "3", field: noise_seed }
  steps: { node: "9", field: steps }
  width: { node: "10", field: width }
  height: { node: "10", field: height }
outputs:
  image: { node: "1", type: image }
lora_chain:
  loader: LoraLoaderModelOnly
  max: 8
  from: { node: "4", output: 0 }
  to:
    - { node: "11", field: model }
