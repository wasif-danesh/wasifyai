workflow: qwen-image-2.1-edit.json
notes: >
  Change a picture with Qwen-Image 2.1 (int8). Converted from ComfyUI's template image_qwen_image_2_1_image_edit
  with ComfyUI 0.44.2, its prompt rewriter removed and its second picture taken out (two pictures are the
  reference workflow). The size follows the picture.
models:
  - diffusion_models/qwen_image_2.1_int8_convrot.safetensors
  - text_encoders/qwen3vl_8b_int8_convrot.safetensors
  - vae/qwen_image_2.1_vae_bf16.safetensors
inputs:
  prompt: { node: "7", field: prompt }
  seed: { node: "5", field: seed }
  steps: { node: "5", field: steps }
  image: { node: "9", field: image }
outputs:
  image: { node: "8", type: image }
lora_chain:
  loader: LoraLoaderModelOnly
  max: 8
  from: { node: "1", output: 0 }
  to:
    - { node: "6", field: model }
