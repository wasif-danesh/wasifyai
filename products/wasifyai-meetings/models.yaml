# The speaker model of Meetings (ADR-0108, decision 8): tells the people of a recording apart. Listed in
# the Models panel and downloaded only after a click that shows the file, its size and source. The file is
# pinned by size and SHA-256; the URL names a commit of the repository, so it cannot change under the pin.
# A community export of NVIDIA's model to ONNX (docs/spikes/meetings-mt0.md); it ran exactly as the spike's.
models:
  - id: sortformer-4spk-v2.1
    title: Sortformer 4 speakers (speaker model for meetings)
    source: https://huggingface.co/christopherthompson81/sortformer_parakeet_onnx
    note: Tells up to four people of a recording apart. Any language. Runs on the processor, about 70 times
      faster than the recording. Made by NVIDIA; exported to ONNX by Christopher Thompson.
    approx_ram_gb: 1
    files:
      - folder: meetings
        name: diar_streaming_sortformer_4spk-v2.1.onnx
        url: https://huggingface.co/christopherthompson81/sortformer_parakeet_onnx/resolve/434632d5eefa7ae83743cd02a8a26e64ce9fc1dd/diar_streaming_sortformer_4spk-v2.1.onnx
        size: 492268840
        sha256: d853932ae552342c48693b8d9dc02709f2d850c80a37cb5b422d14f599b7b8bc
  # The voiceprint model (ADR-0108, decision 11; stage MT3): knows a person's voice again in a later
  # meeting, so People can suggest who a speaker is. 3D-Speaker's ERes2Net (VoxCeleb) as ONNX, the same
  # file sherpa-onnx publishes; the same file as spike MT0b measured.
  - id: eres2net-voxceleb
    title: ERes2Net voiceprints (knows people again in meetings)
    source: https://huggingface.co/csukuangfj/speaker-embedding-models
    note: Makes a voiceprint of each speaker, so a person you named is suggested in later meetings. Any
      language. Small and quick, on the processor. Made by Alibaba's 3D-Speaker; ONNX by the sherpa-onnx project.
    approx_ram_gb: 0.2
    files:
      - folder: meetings
        name: 3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx
        url: https://huggingface.co/csukuangfj/speaker-embedding-models/resolve/0743f301363dec56491a490f6d6cbc9d67f9a3bf/3dspeaker_speech_eres2net_sv_en_voxceleb_16k.onnx
        size: 26485263
        sha256: c59158379255ad66e161679cca6af8d52d51e389e3224ab7d7a7baae295c2db5
