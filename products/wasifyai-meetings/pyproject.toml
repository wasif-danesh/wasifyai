[project]
name = "wasifyai-meetings"
version = "0.0.0"
requires-python = ">=3.12"
# onnxruntime runs the speaker model on the processor (ADR-0108, decision 8)
dependencies = ["wasifyai-platform-sdk", "langgraph>=0.6", "pydantic>=2.9", "numpy>=2", "onnxruntime>=1.20", "imageio-ffmpeg>=0.5"]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-meetings = "wasifyai_meetings:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_meetings"]
