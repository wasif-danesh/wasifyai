[project]
name = "wasifyai-model3d"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["wasifyai-platform-sdk", "langgraph>=0.6", "pydantic>=2.9", "pillow>=10"]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-model3d = "wasifyai_model3d:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_model3d"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "wasifyai_model3d/prompts"  # the code reads them inside the package when installed (backlog D29)
