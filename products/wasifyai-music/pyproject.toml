[project]
name = "wasifyai-music"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "wasifyai-platform-sdk",
    "langgraph>=0.6",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "pillow>=10",
    "imageio-ffmpeg>=0.5",
]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-music = "wasifyai_music:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_music"]
