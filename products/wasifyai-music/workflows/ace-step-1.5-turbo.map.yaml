workflow: ace-step-1.5-turbo.json
licence: "MIT per the ACE-Step 1.5 model card (ADR-0012)"
notes: >
  Executed against ComfyUI 0.39 with the all-in-one checkpoint: a 60 s song takes about 77 s, and
  the output is a valid MP3 of the requested length with the lyrics sung in order. It matches the
  official ComfyUI template (8 steps, cfg 1, euler/simple, shift 3). Keep lyrics to 12-16 sung
  lines for 60 s (about four seconds per line). Run `make test-comfyui` to re-check.
models:
  - checkpoints/ace_step_1.5_turbo_aio.safetensors
inputs:
  lyrics: { node: "3", field: lyrics }
  style: { node: "3", field: tags }          # music tags such as "pop, upbeat, female vocals"
  seed:
    - { node: "3", field: seed }
    - { node: "6", field: seed }
  duration_s:                                # read by the text encoder and by the empty latent
    - { node: "3", field: duration }
    - { node: "5", field: seconds }
  bpm: { node: "3", field: bpm }
  language: { node: "3", field: language }
  keyscale: { node: "3", field: keyscale }
outputs:
  audio: { node: "8", type: audio }
