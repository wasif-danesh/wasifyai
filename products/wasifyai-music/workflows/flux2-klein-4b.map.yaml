workflow: flux2-klein-4b.json
licence: "Apache-2.0 per the FLUX.2 [klein] 4B model card (ADR-0019). The 9B variant is licensed differently and is not used"
notes: >
  Executed against ComfyUI 0.39: a 1024x1024 cover takes about 25 s and the output is a valid PNG.
  It matches the official ComfyUI template (4 steps, cfg 1). The VAE comes from the
  Comfy-Org/flux2-klein repo (Apache-2.0); the template points at the flux2-dev VAE, which carries a
  non-commercial label, so do not swap it in. Run `make test-comfyui` to re-check.
models:
  - diffusion_models/flux-2-klein-4b.safetensors
  - text_encoders/qwen_3_4b.safetensors
  - vae/flux2-vae.safetensors
inputs:
  prompt: { node: "4", field: text }
  seed: { node: "9", field: noise_seed }
  steps: { node: "7", field: steps }
  width:
    - { node: "6", field: width }
    - { node: "7", field: width }
  height:
    - { node: "6", field: height }
    - { node: "7", field: height }
outputs:
  image: { node: "13", type: image }
