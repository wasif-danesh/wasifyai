# The search model of notebooks (ADR-0065 decision 8): turns a passage and a question into vectors so
# a question finds the passage that means the same. Listed in the Models panel and downloaded only after
# a click that shows the files, sizes, source and licence. The files are pinned by size and SHA-256; the
# URLs name a commit of the repository, so they cannot change under the pin.
models:
  - id: bge-small-en-v1.5
    title: BGE small English (search model for notebooks)
    licence: MIT
    source: https://huggingface.co/Qdrant/bge-small-en-v1.5-onnx-Q
    note: Finds the passages of your documents that match a question. English. Runs on the processor.
    approx_ram_gb: 1
    files:
      - folder: embeddings
        name: bge-small-en-v1.5-q.onnx
        url: https://huggingface.co/Qdrant/bge-small-en-v1.5-onnx-Q/resolve/aa8f8b060edb00e03bfdd08813a2949946c8ba55/model_optimized.onnx
        size: 66465124
        sha256: 51f1bd0addd6e859e42c2c8021a5e5461385bb676a649f4b269aa445449f2431
      - folder: embeddings
        name: bge-small-en-v1.5-tokenizer.json
        url: https://huggingface.co/Qdrant/bge-small-en-v1.5-onnx-Q/resolve/aa8f8b060edb00e03bfdd08813a2949946c8ba55/tokenizer.json
        size: 711396
        sha256: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66
