[project]
name = "wasifyai-notebooks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "wasifyai-platform-sdk",
  "pydantic>=2.9",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  # ADR-0065, approved 2026-10-16; licences confirmed in the E0 spike (S5)
  "chonkie>=1.7",
  "sqlite-vec>=0.1.9",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=2",
  # Studio (E4): Word and PDF built from Markdown; reportlab approved by the owner 2026-10-16
  "markdown-it-py>=3",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "reportlab>=4.2",
  "pillow>=10",
  # the web profile keeps the library in Postgres (pgstore.py)
  "psycopg[binary,pool]>=3.2",
  # the search model through the gateway (embedding.py)
  "httpx>=0.27",
]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-notebooks = "wasifyai_notebooks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_notebooks"]
