[project]
name = "wasifyai-notebooks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "wasifyai-platform-sdk",
  "pydantic>=2.9",
  "pyyaml>=6",
  "python-multipart>=0.0.9",
  # ADR-0065, approved 2026-10-16; licences confirmed in the E0 spike (S5)
  "chonkie>=1.7",
  "sqlite-vec>=0.1.9",
  "onnxruntime>=1.20",
  "tokenizers>=0.20",
  "numpy>=2",
]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-notebooks = "wasifyai_notebooks:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_notebooks"]
