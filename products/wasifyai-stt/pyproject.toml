[project]
name = "wasifyai-stt"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["wasifyai-platform-sdk", "langgraph>=0.6", "pydantic>=2.9", "sqlalchemy[asyncio]>=2.0", "pyyaml>=6"]

# The API discovers installed products through this entry point (GraphRegistry.load_entry_points).
[project.entry-points."wasifyai.products"]
wasifyai-stt = "wasifyai_stt:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wasifyai_stt"]
include = ["wasifyai_stt/languages.yaml"]
