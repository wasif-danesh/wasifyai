# The languages a user can choose (ADR-0043), each with its name in its own script and in English.
# `quality` comes from the measurements in ADR-0043 (FLEURS read speech, Whisper large-v3-turbo):
#   good     word error under about 10 percent (character error for Chinese and Japanese)
#   fair     10 to 20 percent
#   limited  worse than that: shown on the page with a plain note
#   unrated  not measured yet
# "Detect the language" is always offered first; it is not a language in this list.
engines:
  whisper:
    model: deepdml/faster-whisper-large-v3-turbo-ct2   # transcribes
    detect_model: Systran/faster-whisper-large-v3      # decides the language when none is given
  # IndicConformer (MIT, ai4bharat) serves these through the `stt-indic` server: 0.13 to 0.15 word error for
  # Bengali and 0.07 to 0.09 for Hindi on FLEURS, against 0.7 to 0.8 and 0.29 for Whisper (ADR-0043).
  # Whisper is used for them only where that server is not running.
  indic:
    languages: [as, bn, brx, doi, gu, hi, kn, kok, ks, mai, ml, mni, mr, ne, or, pa, sa, sat, sd, ta, te, ur]
languages:
- {id: en, name: English, english: English, quality: good}
- {id: es, name: Español, english: Spanish, quality: good}
- {id: fr, name: Français, english: French, quality: good}
- {id: de, name: Deutsch, english: German, quality: good}
