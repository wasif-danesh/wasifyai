# Bengali (Indic Parler-TTS): the voice is a named speaker plus a description, from the model card's
# recommended speakers (Aditi, Arjun). Grade B: a native Bengali listener reviewed the samples on 2026-10-09 and found both voices good (the model card gives no letter grades for this engine).
- id: indic-parler:aditi
  language: bn
  gender: female
  label: Aditi
  engine: indic-parler
  engine_voice: Aditi speaks clearly at a moderate pace, in a close, high quality recording with no background noise.
  default: true
  grade: B
- id: indic-parler:arjun
  language: bn
  gender: male
  label: Arjun
  engine: indic-parler
  engine_voice: Arjun speaks clearly at a moderate pace, in a close, high quality recording with no background noise.
  default: true
  grade: B
