# The voices a user can choose (ADR-0042). A language has a male and a female choice; a combination with
# no voice is shown as unavailable, never replaced silently. `default: true` is the voice used when the user
# does not pick one (the voice the model card grades highest for that language and gender, then confirmed by the evaluation and by listening). Generated from
# the speech server's own list of Kokoro voices, then curated: edit by hand, keep `engine_voice` exact.
# Not offered: Japanese and Chinese. Kokoro has voices for them, but the Speaches server cannot make them
# (its phonemiser has no Chinese, and Japanese comes back empty), measured 2026-10-09. They return when an
# engine that can speak them is added (ADR-0042).
engines:
  kokoro:
    model: speaches-ai/Kokoro-82M-v1.0-ONNX
    max_chars: 400
  indic-parler:
    model: ai4bharat/indic-parler-tts
    max_chars: 250
