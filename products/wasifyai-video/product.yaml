id: wasifyai-video
capabilities:
  text.enhance:        { provider: litellm, model: prompt-enhancer }
  text.describe_image: { provider: litellm, model: multimodal, inputs: [text, image] }
# the models a person can choose (ADR-0097); the first is used when a request names none. A model's
# `frames_per_second` turns the seconds asked for into frames: the fewest it can make, a count of
# `frame_step * n + frame_offset` (LTX 8n + 1, Wan 4n + 1, MiniMax-H3 17n + 5);
# `draft: false` and `looks: false` say it has no draft setting and takes no taught looks.
# Wan 2.2 14B makes video from words only, on its fp16 files (fp8 does not load on a Mac); picture to video
# (workflow wan2.2-14b-i2v) waits for its own fp16 files.
models:
  - id: ltx-video-2b
    settings: { frames_per_second: 24, frame_step: 8, frame_offset: 1 }
    capabilities:
      video.generate:  { provider: comfyui, workflow: ltx-video-2b-t2v, defaults: { width: 768, height: 512, length: 121, steps: 30 } }
      video.animate:   { provider: comfyui, workflow: ltx-video-2b-i2v, defaults: { length: 121, steps: 30 } }
      video.extend:    { provider: comfyui, workflow: ltx-video-2b-extend, defaults: { length: 121, steps: 30 } }
  - id: wan2.2-14b
    settings: { frames_per_second: 16, frame_step: 4, frame_offset: 1, draft: false, looks: false }
    capabilities:
      video.generate:  { provider: comfyui, workflow: wan2.2-14b-t2v, defaults: { width: 832, height: 480, length: 81 } }
  - id: minimax-h3
    settings: { frames_per_second: 24, frame_step: 17, frame_offset: 5, draft: false, looks: false }
    capabilities:
      video.generate:  { provider: comfyui, workflow: minimax-h3-t2v, defaults: { width: 768, height: 512, length: 124 } }
uploads:
  image: { max_bytes: 10485760 }
enhance:
  text_to_video:  { prompt: enhance_text_to_video, max_chars: 500 }
  image_to_video: { prompt: enhance_image_to_video, max_chars: 500, needs_picture: true }
