workflow: ltx-video-2b-i2v.json
licence: "LTX-Video 2B v0.9.5: Open RAIL-M (March 2025), commercial use allowed with use restrictions that must reach users (ADR-0037). Later LTX weights use a different licence; do not swap them in without a new check"
notes: >
  Image to video. Built from ComfyUI's official template ltxv_image_to_video (v0.9.5 weights). The
  picture is scaled to about a quarter megapixel in multiples of 32 and its size gives the clip's size,
  so there is no size input. The first frame is held at full strength (1.0): at the template's 0.15 the
  model ignored the picture and drew the prompt. The prompt must describe the picture. The worker
  uploads the user's picture under a per-job name and the API writes that name into LoadImage. Needs
  fp32 on Apple silicon like the text workflow (ADR-0037).
models:
  - checkpoints/ltx-video-2b-v0.9.5.safetensors
  - text_encoders/t5xxl_fp16.safetensors
inputs:
  prompt: { node: "6", field: text }
  seed: { node: "72", field: noise_seed }
  steps: { node: "71", field: steps }
  length: { node: "77", field: length }
  image: { node: "78", field: image }
outputs:
  video: { node: "81", type: video }
