workflow: minimax-h3-i2v.json
notes: >
  Picture to video with sound, MiniMax-H3: the text to video workflow (minimax-h3-t2v) with the picture as
  `first_frame` of MiniMaxH3ImageToVideo (as in ComfyUI's template video_minimax_h3_i2v). The picture is scaled to
  about `megapixels` in multiples of 32 and the clip takes its shape.
models:
  - diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
  - loras/minimax_h3_fl2v_turbo_8step_v1.0_comfyui_bf16.safetensors
  - text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
  - vae/minimax_h3_video_vae_fp16.safetensors
  - vae/minimax_h3_audio_vae_fp32.safetensors
inputs:
  prompt: { node: "12", field: prompt }
  seed: { node: "8", field: noise_seed }
  megapixels: { node: "17", field: megapixels }
  image: { node: "16", field: image }
  length: { node: "12", field: length }
outputs:
  video: { node: "1", type: video }
