workflow: wan2.2-14b-t2v.json
notes: >
  Text to video with Wan 2.2 14B (fp8).
  ComfyUI's template written out by hand (ComfyUI 0.44.2): the high-noise model makes the first two of four steps and
  the low-noise model the last two, each with Lightx2v's 4-step LoRA, CFG 1, shift 5, euler (the only sampler that
  worked for Wan on this Mac, docs/spikes, W0). 16 frames a second: 81 frames make 5 s.
models:
  - diffusion_models/wan2.2_t2v_high_noise_14B_fp16.safetensors
  - diffusion_models/wan2.2_t2v_low_noise_14B_fp16.safetensors
  - loras/wan2.2_t2v_lightx2v_4steps_lora_v1.1_high_noise.safetensors
  - loras/wan2.2_t2v_lightx2v_4steps_lora_v1.1_low_noise.safetensors
  - text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
  - vae/wan_2.1_vae.safetensors
inputs:
  prompt: { node: "14", field: text }
  seed: { node: "7", field: noise_seed }
  width: { node: "16", field: width }
  height: { node: "16", field: height }
  length: { node: "16", field: length }
outputs:
  video: { node: "1", type: video }
