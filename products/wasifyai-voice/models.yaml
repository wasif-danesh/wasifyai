# after a click that has shown its name, size and source) plus a `voice:` block, the model's descriptor.
# Figures under `measured` are from the owner's Mac (docs/spikes/voice-v0.md); voices, languages and options agree
# with specs/ (a test checks it). `clone`, `design` and `music` say how a model takes a recording, a voice description, or a music request. The URLs name a commit of the repository, so they cannot change under the pin.
