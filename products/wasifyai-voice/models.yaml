# The speech models this product can use, and where they come from (ADR-0066, docs/phase2-voice-plan.md).
# Each entry is a download entry like the image models' (pinned by commit, size and SHA-256; a file is fetched only
# after a click that has shown its name, size, source and licence) plus a `voice:` block, the model's descriptor.
# Figures under `measured` are from the owner's Mac (docs/spikes/voice-v0.md); voices, languages and options agree
# with specs/ (a test checks it). `commercial_use` is read from the model card (`licence_evidence`); only `yes` can
# be recommended. `clone`, `design` and `music` say how a model takes a recording, a voice description, or a music request. The URLs name a commit of the repository, so they cannot change under the pin.
