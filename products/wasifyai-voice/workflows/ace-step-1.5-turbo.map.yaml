notes: 'Copied from the workflows of the first music product (since removed) (ComfyUI 0.39 to 0.41, the all-in-one checkpoint, 8 steps,
  cfg 1, euler/simple, shift 3). The desktop changes only the last node: PreviewAudio keeps the result in ComfyUI''s
  temporary folder, where SaveAudioMP3 would leave a file in its output folder. Timesignature is mapped here too.'
models:
- checkpoints/ace_step_1.5_turbo_aio.safetensors
inputs:
  lyrics:
    node: '3'
    field: lyrics
  style:
    node: '3'
    field: tags
  seed:
  - node: '3'
    field: seed
  - node: '6'
    field: seed
  duration_s:
  - node: '3'
    field: duration
  - node: '5'
    field: seconds
  bpm:
    node: '3'
    field: bpm
  language:
    node: '3'
    field: language
  keyscale:
    node: '3'
    field: keyscale
  timesignature:
    node: '3'
    field: timesignature
outputs:
  audio:
    node: '8'
    type: audio
