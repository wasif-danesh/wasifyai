[project]
name = "wasifyai"
version = "0.0.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8", "pyright>=1.1.380", "httpx>=0.27"]

[tool.uv.workspace]
members = ["services/*", "packages/contracts", "packages/platform-sdk", "products/*"]
exclude = ["products/hello", "products/media-demo", "services/comfyui"]   # config-only samples; a container-only service

[tool.uv.sources]
wasifyai-api = { workspace = true }
wasifyai-media-worker = { workspace = true }
wasifyai-contracts = { workspace = true }
wasifyai-platform-sdk = { workspace = true }
wasifyai-notebooks = { workspace = true }
wasifyai-voice = { workspace = true }
wasifyai-video = { workspace = true }
wasifyai-model3d = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# measurement scripts kept next to their results; not product code
extend-exclude = ["docs/spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# the sample generator is mostly the sentences a person is asked to listen for
"scripts/listening_samples.py" = ["E501"]
"scripts/listening_page.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pyright]
include = ["services", "packages", "products"]
# its libraries (torch, MuseTalk) exist only inside its own environment
exclude = ["services/api/src/wasifyai_api/lipsync_server", "services/comfyui", ".lipsync", "**/node_modules", "**/.venv"]
typeCheckingMode = "standard"
# Test helper modules (conftest, fake_comfyui) are imported by name; pytest puts their folders on
# sys.path, so tell pyright too.
extraPaths = ["products/wasifyai-image/tests", "products/wasifyai-video/tests", "products/wasifyai-model3d/tests", "products/wasifyai-assistant/tests", "products/wasifyai-notebooks/tests", "products/wasifyai-voice/tests", "services/media-worker/tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# a single test over 10 minutes dumps every thread's stack to the log (the slowest real one is about 2)
faulthandler_timeout = 600
testpaths = ["services", "packages", "products"]
