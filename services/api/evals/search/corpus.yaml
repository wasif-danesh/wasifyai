      - { kind: speech, lang: fr, text: "Ce matin, un renard roux a traversé la neige fraîche derrière la maison. Ses traces menaient vers la forêt de sapins." }
      - { kind: transcript, lang: ru, text: "Рассказ о лисе. Сегодня утром рыжая лиса прошла по свежему снегу, и следы вели в сосновый лес. Мы тихо стояли у окна." }
      - { kind: lipsync, lang: es, text: "Un zorro rojo cuenta cómo cruzó el bosque nevado esta mañana. Voz suave y tranquila." }
    queries:
      - { lang: ru, text: "рыжая лиса на снегу в зимнем лесу" }
