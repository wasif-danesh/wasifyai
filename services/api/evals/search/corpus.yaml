# A synthetic library for measuring search (ADR-0041): 24 concepts, each as three items in three
# different languages (a song, an image prompt and a video prompt), so a good search must find them across
# languages. `queries` are phrased differently from the items, in a language that is sometimes the same
# as one of the items and sometimes not. `nomatch` queries have nothing in the library to find.
# Nothing here is user data.
concepts:
  - id: rain-city
    items:
      - { kind: song,  lang: es, text: "Lluvia en la ciudad. Balada melancólica. Camino solo de noche bajo la lluvia, las luces de neón se reflejan en el asfalto mojado" }
      - { kind: image, lang: fr, text: "Une rue de Paris la nuit sous une pluie fine, reflets lumineux des enseignes sur les pavés mouillés, ambiance mélancolique" }
      - { kind: video, lang: zh, text: "夜晚的城市街道下着大雨，霓虹灯倒映在湿漉漉的路面上，镜头缓缓向前推进" }
    queries:
      - { lang: en, text: "sad song about walking home alone in the rain at night" }
      - { lang: hi, text: "रात में शहर की बारिश में भीगी सड़कें और चमकती रोशनी" }
      - { lang: es, text: "canción triste sobre volver a casa bajo la lluvia" }
