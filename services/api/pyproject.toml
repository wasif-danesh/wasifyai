[project]
name = "wasifyai-api"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "python-json-logger>=2.0",
  "langgraph>=0.6",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary,pool]>=3.2",
  "openai>=1.50",
  "wasifyai-contracts",
  "wasifyai-platform-sdk",
  "pyjwt>=2.9",
  "prometheus-client>=0.21",
  "langgraph-checkpoint-sqlite>=3.1.2",
]

[project.optional-dependencies]
# The desktop profile runs the media worker inside the engine process (ADR-0056). The notebooks
# product is named so that its own packages (the chunker, the search model runtime, Word and PDF
# writers) are in the hashed lock the app installs from (scripts/build-engine-bundle.sh).
desktop = ["wasifyai-media-worker", "wasifyai-notebooks", "wasifyai-voice"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasifyai_api"]
