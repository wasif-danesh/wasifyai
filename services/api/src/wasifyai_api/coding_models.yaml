# The models a coding session can run on (ADR-0101, decision 7). Read by the model gateway
# (wasifyai_api/coding_gateway.py); the person chooses one on Code's model button.
#
# `models` are the ones run through the coding evaluation (products/wasifyai-code/evals): Claude
# Sonnet 5.5 first, then Claude Haiku 5.5 (cheaper), then the local Qwen 27B. They are shown as
# "Tested for coding".
#
# `vendors` are the providers whose own list of models is offered as well (owner, 2026-11-15:
# "It shouldn't be hardcoded to 1/2 options"): every chat model the key saved under Settings ›
# Your keys › Chat and writing lists is a choice, named `<vendor>:<the vendor's model name>`.
# Such a model was not run through the evaluation. Its price is the one chat's catalogue knows
# (own_keys_catalogue.py); a model with no known price is counted in tokens, and its session
# stops at `token_limit` tokens in and out unless the person sets another.
#
#   shape            how the Agent Server calls the model, and so which of the gateway's two
#                    doors it uses: "anthropic" (the Messages API) or "openai" (chat completions)
#   engine_model     the name the Agent Server is given (its own library's name for the model)
#   provider_model   the only model name the gateway lets through for this entry
#   upstream         where the gateway sends the call. "ollama" is the address in OLLAMA_BASE_URL
#   secret           where the key is in the app's secret store (Settings › Your keys). Empty for
#                    a model on this computer, which needs none
#   price            US dollars per million tokens, as counted by the gateway. It is a count for
#                    the session's limit and its header, not the provider's bill
#   long_prompt      for a model that costs more for a long prompt: `over` (the prompt's tokens,
#                    counting what was read from and written to the cache) and the `price` of
#                    such a call. Each call is priced by itself
#   engine_settings  passed to the Agent Server with the model, unchanged
default: claude-sonnet-5-5
models:
  claude-sonnet-5-5:
    title: Claude Sonnet 5.5
    where: cloud
    shape: anthropic
    provider: anthropic
    engine_model: anthropic/claude-sonnet-5-5
    provider_model: claude-sonnet-5-5
    upstream: https://api.anthropic.com
    secret: keys.chat.anthropic
    # a cache write that lasts five minutes costs 1.25 times the input price, one that lasts an
    # hour twice; a cache read 0.10 dollars
    price: { input: 2.0, output: 10.0, cache_read: 0.10, cache_write: 2.5, cache_write_1h: 4.0 }
    engine_settings: {}
  # the cheaper cloud model (owner, 2026-11-15): 35 and 36 of the 36 evaluation tasks in two runs,
  # at about a thirteenth of Sonnet's cost and a third more steps (docs/spikes/coding-haiku.md)
  claude-haiku-5-5:
    title: Claude Haiku 5.5
    where: cloud
    shape: anthropic
    provider: anthropic
    engine_model: anthropic/claude-haiku-5-5
    provider_model: claude-haiku-5-5
    upstream: https://api.anthropic.com
    secret: keys.chat.anthropic
    price: { input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125, cache_write_1h: 0.20 }
    # a call whose prompt is over 100,000 tokens costs five times as much, all of it
    long_prompt:
      over: 100000
      price: { input: 0.50, output: 2.50, cache_read: 0.05, cache_write: 0.625, cache_write_1h: 1.0 }
    engine_settings: {}
  qwen-27b-ollama:
    title: Qwen 27B on this computer (Ollama)
    where: this-computer
    shape: openai
    provider: ollama
    engine_model: openai/qwen3.8:27b-mlx
    provider_model: qwen3.8:27b-mlx
    upstream: ollama
    secret: ""
    price: {}
    # what the C0 spikes ran it with: no thinking, its own tool calls, one retry
    engine_settings:
      native_tool_calling: true
      reasoning_effort: none
      litellm_extra_body: { reasoning_effort: none }
      max_input_tokens: 24000
      max_output_tokens: 4096
      temperature: 0.2
      num_retries: 1
# every chat model a saved key lists, beside the tested ones above
#   shape, upstream, secret   as for a model
#   engine_prefix             put before the vendor's model name for the Agent Server
#   cache                     what a cache read and a cache write cost, as parts of the input
#                             price. Without it a cached token is counted at the input price
vendors:
  anthropic:
    title: Anthropic
    shape: anthropic
    engine_prefix: anthropic/
    upstream: https://api.anthropic.com
    secret: keys.chat.anthropic
    cache: { read: 0.1, write: 1.25, write_1h: 2.0 }
  openai:
    title: OpenAI
    shape: openai
    engine_prefix: openai/
    upstream: https://api.openai.com/v1
    secret: keys.chat.openai
  gemini:
    title: Google Gemini
    shape: openai
    engine_prefix: openai/
    upstream: https://generativelanguage.googleapis.com/v1beta/openai
    secret: keys.chat.gemini
# the most tokens (in and out) one session on a model with no known price may use
token_limit: 3000000
