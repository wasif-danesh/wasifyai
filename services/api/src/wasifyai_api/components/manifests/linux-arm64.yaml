# The optional components on linux-arm64 (stage F2 of the 2026-10-27 plan): what each fetches, pinned by
# size and SHA-256. Data, read by wasifyai_api/components; scripts/build-engine-bundle.sh reads the list.
schema: 1
platform: linux-arm64
python: "3.12.15"  # the Python a component's own environment is made with
components:
  llamacpp:
    title: Language engine (llama.cpp)
    version: b11655
    source: github.com/ggml-org/llama.cpp
    min_free_bytes: 268435456
    backend: cpu
    archive:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11655/llama-b11655-bin-ubuntu-arm64.tar.gz
      size: 13886215
      sha256: 5b3b62ede4f1ea1e33a1f50018f536d45a1b11ece980b1f9d9adefe43817ffa6
      kind: tar.gz
      strip: 1
# What the parts the engine's services set up fetch (stage F2; these were the *_pins.json files).
# Paths in them are relative to the wasifyai_api package. Every platform carries every part, so
# an engine anywhere can say what a part needs and that it is not available on this computer.
parts:
  audiocpp:
    pins:
      comment: Pinned audio.cpp runtime (Apache-2.0, ShugoAI LLC; this is Unsloth's build of upstream
        v0.9.0). Sizes and SHA-256 from the release's asset digests. Only darwin-arm64 is measured (docs/spikes/voice-v0.md);
        the others are pinned so the app can offer them, and say they are not measured.
      repo: unslothai/audio.cpp
      tag: v0.9.0-unsloth.1
      server: audiocpp_server
      assets:
        linux-arm64:
          name: audio-v0.9.0-unsloth.1-bin-ubuntu-arm64-cpu.tar.gz
          url: https://github.com/unslothai/audio.cpp/releases/download/v0.9.0-unsloth.1/audio-v0.9.0-unsloth.1-bin-ubuntu-arm64-cpu.tar.gz
          size: 46188288
          sha256: 1ce3a1c976216bbd451a3a16f0db0de6aed94602e652fa9208e03ac447319b9f
          backend: cpu
          measured: false
          archive: tar.gz
  musetalk:
    pins:
      comment: 'The lip sync engine''s environment (ADR-0066, stage V5): MuseTalk''s code at an exact
        commit (MIT), and the hashed package lock the server runs from. The weights are catalogue entries
