# The model aliases the platform ships with (ADR-0025). Graphs and products ask for these names; an
# admin can point any of them at another provider and model, and "reset" returns to what is here.
#
# The API seeds these into LiteLLM's database at start (idempotent). `{OLLAMA_BASE_URL}` and
# `{OLLAMA_OPENAI_BASE_URL}` are filled from the API's settings when an alias uses them;
# `ollama_chat/<model>` entries are the models `make setup` pulls (scripts/lib.sh reads this file).
# Since ADR-0100 no default uses Ollama.
#
# Behaviour parameters (temperature, think, reasoning_effort) stay with the alias when an admin
# changes provider or model; LiteLLM drops the ones a provider does not support.
aliases:
  # ADR-0100: every text job on the web runs on Claude Haiku 5.5 (Anthropic directly, through
  # LiteLLM's `anthropic/`). Haiku 5.5 takes no temperature (a 400), so none is set here; how much
  # it thinks is `reasoning_effort`, which LiteLLM sends as adaptive thinking and
  # `output_config.effort`. Without `max_tokens` LiteLLM would send 128000, so each alias sets one.
  # The key is LiteLLM's own environment (`ANTHROPIC_API_KEY`); an admin can bind an alias to
  # another vendor and key in Admin › Models.
  default-chat:
    purpose: Chat, Notebook answers, dubbing and speech scripts
    kind: chat
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: medium
      max_tokens: 16000
  # Planning and tool use: the assistant, Creative Studio's plan and Motion graphics' drafts.
  planner:
    purpose: The assistant, Creative Studio's plan and Motion graphics (thinks the most)
    kind: chat
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: high
      max_tokens: 32000
  lyrics-writer:
    purpose: Writes song titles, lyrics, style tags and cover prompts
    kind: chat
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: low
      max_tokens: 8000
  # Rewrites a user's prompt for the image, video and music models (ADR-0038).
  prompt-enhancer:
    purpose: Rewrites a user's prompt into a clearer one for the generation models
    kind: chat
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: low
      max_tokens: 8000
  # Pictures in a prompt (describing a picture, judging a training sample). Claude takes no audio.
  multimodal:
    purpose: Image input to the model
    kind: chat
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      reasoning_effort: low
      max_tokens: 8000
  # Embeddings (ADR-0100, decision 4): OpenAI's text-embedding-3-small ($0.02 per million tokens),
  # asked for the same sizes as before so the vector columns stay: 1024 for searching My creations
  # (ADR-0041) and 768 for the RAG helper (migration 0003). Changing the embedder means the search
  # index is built again.
  creation-embedder:
    purpose: Multilingual embeddings for searching My creations
    kind: embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      dimensions: 1024
  embedder:
    purpose: Text embeddings for search (RAG)
    kind: embedding
    litellm_params:
      model: openai/text-embedding-3-small
      api_key: os.environ/OPENAI_API_KEY
      dimensions: 768
  # Speech on the web (W5, ADR-0066): the voice product asks the gateway for these, and the provider the
  # alias is bound to receives the text, or the recording. The admin binds them to the provider's own speech
  # and transcription models (OpenRouter or similar); the defaults are only a starting point and need a key.
  voice-speak:
    purpose: Hosted text to speech for the web voice screens (the provider receives the text)
    kind: speech
    litellm_params:
      model: openai/tts-1
  voice-transcribe:
    purpose: Hosted speech to text for the web voice screens (the provider receives the recording)
    kind: transcription
    litellm_params:
      model: openai/whisper-1
