[project]
name = "wasifyai-engine-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5",
    "pydantic-settings>=2.6",
    "wasifyai-api",
    "wasifyai-platform-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasifyai_engine_worker"]

[tool.uv.sources]
wasifyai-api = { workspace = true }
wasifyai-platform-sdk = { workspace = true }
