[project]
name = "wasifyai-media-worker"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "redis>=5",
    "httpx>=0.27",
    "numpy>=1.26",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.6",
    "wasifyai-contracts",
    "wasifyai-platform-sdk",
    "websockets>=16.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wasifyai_media_worker"]
